type = "num"
description = "The maximum packet count that a queue can use above the shared cap to trigger a random tail drop (`queueX-shared-packet-cap` in `/in/eth/sw/qos/port/print` usage) . For example, if `queue1-shared-packet-cap=3072` and `wred-packet-cap=512`, WRED triggers when `queue1-packet-use` exceeds 3072, reaching 100% drop rate at 3072+512=3584 packets."
[[menus.read_only]]
name = "wred-byte-cap"
type = "num"
description = "The maximum byte count that a queue can use above the shared cap to trigger a random tail drop (`queueX-shared-byte-cap`). For example, if `queue1-shared-byte-cap=768KiB` and `wred-byte-cap=128KiB`, WRED triggers when `queue1-packet-use` exceeds 768KiB, reaching 100% drop rate at 768+128=896KiB."

