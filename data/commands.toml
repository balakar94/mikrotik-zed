description = "MAC address of the OVPN interface. Automatically generated if not specified."
[[menus.arguments]]
name = "max-mtu"
type = "num"
description = "Maximum Transmission Unit. Maximum packet size that the OVPN interface can send without packet fragmentation."
[[menus.arguments]]
