description = "Allowed ciphers. To use GCM ciphers, set auth to null, because the GCM cipher also handles authentication."
[[menus.arguments]]
name = "use-peer-dns"
type = "enum (no | yes | exclusively) { no:0, yes:1, exclusively:2 }"
description = "Whether to add DNS servers provided by the OVPN server to IP/DNS configuration."
[[menus.arguments]]
name = "add-default-route"
type = "bool"
description = "Whether to add the OVPN remote address as a default route."
[[menus.arguments]]
name = "route-nopull"
type = "bool"
description = "If enabled, the client does not use routes pushed by the server (including def1)."
[[menus.arguments]]
