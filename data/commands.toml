[[menus]]
path = "/interface/pppoe-server/server"
type = "Directory"
[[menus.flags]]
name = "X"
description = "Whether an item is disabled."
[[menus.flags]]
name = "I"
description = "Whether the server configuration is invalid."
[[menus.arguments]]
name = "service-name"
type = "string"
description = "The PPPoE service name. Server accepts clients that send a PADI message with service-names that match this setting, or if the service-name field in the PADI message is not set."
[[menus.arguments]]
name = "interface"
type = "iface_enum { <l2tp>:0xfffffffe }"
description = ":0xfffffffe }\" mandatory=\"1\">Interface that the clients are connected to."
required = true
[[menus.arguments]]
name = "max-mtu"
type = "num"
description = "Maximum Transmission Unit. The optimal value is the MTU of the interface the tunnel is working over reduced by 20 (so, for 1500-byte Ethernet link, set the MTU to 1480 to avoid fragmentation of packets)."
[[menus.arguments]]
name = "max-mru"
type = "num"
description = "Maximum Receive Unit. The optimal value is the MTU of the interface the tunnel is working over reduced by 20 (so, for 1500-byte Ethernet link, set the MTU to 1480 to avoid fragmentation of packets)."
[[menus.arguments]]
name = "mrru"
type = "num"
description = "Maximum packet size that can be received on the link. If a packet is bigger than tunnel MTU, it is split into multiple packets, allowing full-size IP or Ethernet packets to be sent over the tunnel."
[[menus.arguments]]
name = "authentication"
type = "ubit (pap, chap, mschap1, mschap2)"
description = "Authentication methods that the server accepts."
[[menus.arguments]]
name = "keepalive-timeout"
type = "enum (disabled) { disabled:0 }"
description = "Defines the time period (in seconds) after which the router starts sending keepalive packets every second. If no traffic and no keepalive responses arrive for twice the `keepalive-timeout`, the non-responding client is disconnected. Set to `disabled` to turn off echo packets."
[[menus.arguments]]
name = "one-session-per-host"
type = "bool"
description = "Allow only one session per host (determined by MAC address). If a host tries to establish a new session, the old one is closed."
[[menus.arguments]]
name = "max-sessions"
type = "num"
description = "Maximum number of clients that the AC can serve. `0` means no limitation."
[[menus.arguments]]
name = "pado-delay"
type = "num"
description = "Delay in milliseconds before sending PADO response."
[[menus.arguments]]
name = "default-profile"
type = "enum"
description = "Specifies which PPP profile configuration is used when establishing the tunnel."
[[menus.arguments]]
name = "accept-empty-service"
type = "bool"
description = "Accept PADI with empty service name if no matching PPPoE service is available."
[[menus.arguments]]
name = "pppoe-over-vlan-range"
type = ""
[[menus.arguments]]
name = "accept-untagged"
type = "bool"
description = "Whether to accept untagged (non-VLAN) PPPoE packets on the interface when `pppoe-over-vlan-range` is specified."

