description = "Name of the bonding interface."
[[menus.arguments]]
name = "mtu"
type = "num"
description = "Maximum Transmit Unit in bytes. Must be smaller or equal to the smallest L2MTU value of a bonding slave."
[[menus.arguments]]
name = "forced-mac-address"
type = "macAddr"
description = "By default, the bonding interface will use the MAC address of the first selected slave interface. This property allows to configure static MAC address for the bond interface (all zeros, broadcast or multicast addresses will not apply). RouterOS will automatically change the MAC address for slave interfaces and it will be visible in [`/interface/ethernet`](../ethernet/ethernet.md) configuration export"
[[menus.arguments]]
name = "arp"
type = "enum (disabled | enabled | proxy-arp | reply-only | local-proxy-arp) { disabled:0, enabled:1, pro..."
description = "[Address Resolution Protocol](../../../getting-started/networking-fundamentals/index.md#arp-and-tying-it-all-together) mode."
[[menus.arguments]]
name = "arp-timeout"
type = ""
[[menus.arguments]]
name = "slaves"
type = ""
[[menus.arguments]]
name = "mode"
type = "enum (balance-rr | active-backup | balance-xor | broadcast | 802.3ad | balance-tlb | balance-alb)..."
[[menus.arguments]]
name = "primary"
type = "iface_enum { none:0 }"
description = "Controls the primary interface between active slave ports, works only for `active-backup`, `balance-tlb` and `balance-alb` modes. For `active-backup` mode, it controls which running interface is supposed to send and receive the traffic. For `balance-tlb` mode, it controls which running interface is supposed to receive all the traffic, but for `balance-alb` mode, it controls which interface is supposed to receive the unbalanced traffic (the non-IPv4 traffic). When none of the interfaces are selected as primary, device will automatically select the interface that is configured as the first one."
[[menus.arguments]]
name = "link-monitoring"
type = "enum (none | arp | mii) { none:0, arp:1, mii:2 }"
[[menus.arguments]]
name = "arp-interval"
type = "time"
description = "Time in milliseconds defines how often to monitor ARP requests."
[[menus.arguments]]
name = "arp-ip-targets"
type = ""
[[menus.arguments]]
name = "mii-interval"
type = "time"
description = "How often to monitor the link for failures (used only if link-monitoring is mii)."
[[menus.arguments]]
name = "down-delay"
type = "time"
description = "If a link failure has been detected, the bonding interface is disabled for a down-delay time. Only has effect when link-monitoring is set to mii."
[[menus.arguments]]
name = "up-delay"
type = "time"
description = "If a link has been brought up, the bonding interface is disabled for up-delay time. Only has effect when link-monitoring is set to mii."
[[menus.arguments]]
name = "lacp-rate"
type = "enum (30secs | 1sec) { 30secs:0, 1sec:1 }"
description = "LACP rate specifies how often to exchange LACPDUs between bonding peers. `1sec` - short timeout. `30secs` - long timeout."
[[menus.arguments]]
name = "transmit-hash-policy"
type = "enum (layer-2 | layer-3-and-4 | layer-2-and-3 | encap-2-and-3 | encap-3-and-4) { layer-2:0, layer..."
[[menus.arguments]]
name = "min-links"
type = "num"
description = "How many active slave links needed for bonding to become active."
[[menus.arguments]]
name = "mlag-id"
type = "num"
description = "Changes [MLAG](../../../high-availability-solutions/multi-chassis-link-aggregation-group.md) ID for bonding interface. The same MLAG ID should be used on both peer devices to successfully create a single MLAG.  The [`mlag-peer-port`](../bridge/bridge.md#mlag-peer-port) should not be configured with the MLAG ID."
[[menus.arguments]]
name = "lacp-user-key"
type = "num"
description = "Specifies the upper 10 bits of the port key. The lower 6 bits are automatically assigned based on individual port link speed and duplex."
[[menus.arguments]]
name = "lacp-mode"
type = "enum (passive | active) { passive:0, active:1 }"
[[menus.arguments]]
name = "lacp-system-id"
type = "macAddr"
description = "Specifies the LACP system ID used for LACP negotiations."
[[menus.arguments]]
name = "lacp-system-priority"
type = "num"
description = "Specifies the LACP system priority used for LACP negotiations."
[[menus.read_only]]
name = "mac-address"
type = "macAddr"
description = "MAC address of the bonding interface."

