name = "X"
description = "Whether an item is disabled."
[[menus.flags]]
name = "R"
description = "Whether the interface is running."
[[menus.arguments]]
name = "name"
type = "string"
description = "Descriptive name of the interface."
[[menus.arguments]]
name = "max-mtu"
type = "num"
description = "Maximum Transmission Unit. Maximum packet size that the L2TP interface can send without packet fragmentation."
[[menus.arguments]]
name = "max-mru"
type = "num"
description = "Maximum Receive Unit. Maximum packet size that the L2TP interface can receive without packet fragmentation."
[[menus.arguments]]
name = "mrru"
type = "num"
description = "Maximum packet size that can be received on the link. If a packet is bigger than tunnel MTU, it is split into multiple packets, allowing full-size IP or Ethernet packets to be sent over the tunnel."
[[menus.arguments]]
name = "connect-to"
type = "address (flags=D46v)"
description = "Remote address of the L2TP server. If the address is in the VRF table, VRF should be specified, for example, `192.168.88.1@vrf1` ."
required = true
[[menus.arguments]]
name = "user"
type = "string"
description = "User name used for authentication."
required = true
[[menus.arguments]]
name = "password"
type = "string"
description = "Password used for authentication."
[[menus.arguments]]
name = "profile"
type = "enum"
description = "Specifies which PPP profile configuration is used when establishing the tunnel."
[[menus.arguments]]
name = "keepalive-timeout"
type = "enum (disabled) { disabled:0 }"
description = "Keepalive timeout in seconds."
[[menus.arguments]]
name = "src-address"
type = "ipAddr"
description = "Source address used for the L2TP connection."
[[menus.arguments]]
name = "use-peer-dns"
type = "enum (no | yes | exclusively) { no:0, yes:1, exclusively:2 }"
description = "Whether to use DNS settings from the peer."
[[menus.arguments]]
name = "use-ipsec"
type = "bool"
[[menus.arguments]]
name = "ipsec-secret"
type = "string"
description = "IPsec pre-shared key."
[[menus.arguments]]
name = "allow-fast-path"
type = "bool"
description = "Whether to allow FastPath processing. Must be disabled if IPsec is used."
[[menus.arguments]]
name = "add-default-route"
type = "bool"
description = "Whether to add the L2TP remote address as a default route."
[[menus.arguments]]
name = "default-route-distance"
type = "num"
description = "Distance value applied to the auto-created default route when add-default-route is enabled."
[[menus.arguments]]
name = "dial-on-demand"
type = "bool"
description = "Connects to the L2TP server only when outbound traffic is generated. If enabled, a route with a gateway address from 10.112.112.0/24 network is added while the connection is not established."
[[menus.arguments]]
name = "allow"
type = "ubit (pap, chap, mschap1, mschap2)"
description = "Allowed authentication methods."
[[menus.arguments]]
name = "random-source-port"
type = "bool"
description = "Whether to randomize the source port for L2TP connections."
[[menus.arguments]]
name = "l2tp-proto-version"
type = "enum (l2tpv2 | l2tpv3-ip | l2tpv3-udp) { l2tpv2:0, l2tpv3-ip:1, l2tpv3-udp:2 }"
description = "L2TP protocol version to use."
[[menus.arguments]]
