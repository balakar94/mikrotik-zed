type = "string"
description = "Name of the server."
[[menus.arguments]]
name = "port"
type = "num"
description = "Port to run the server on."
[[menus.arguments]]
name = "mode"
type = "enum (ip | ethernet) { ip:0, ethernet:1 }"
description = "Layer3 or Layer2 tunnel mode (alternatively tun, tap)."
[[menus.arguments]]
name = "protocol"
type = "enum (tcp | udp)"
description = "Transport protocol to use when connecting with the remote endpoint."
[[menus.arguments]]
name = "netmask"
type = "num"
description = "Subnet mask applied to the client."
[[menus.arguments]]
name = "mac-address"
type = "macAddr"
description = "Automatically generated MAC address of the server."
[[menus.arguments]]
name = "max-mtu"
type = "num"
description = "Maximum Transmission Unit. Maximum packet size that the OVPN interface can send without packet fragmentation."
[[menus.arguments]]
name = "keepalive-timeout"
type = "enum (disabled) { disabled:0 }"
description = "Defines the time period (in seconds) after which the router starts sending keepalive packets every second. If no traffic and no keepalive responses are received for twice the keepalive-timeout, the non-responding client is disconnected."
[[menus.arguments]]
name = "default-profile"
type = "enum"
description = "Specifies which PPP profile configuration is used when establishing the tunnel."
[[menus.arguments]]
name = "certificate"
type = "enum"
description = "Certificate from the certificate store that the OVPN server uses."
[[menus.arguments]]
name = "require-client-certificate"
type = "bool"
description = "If set to yes, the server checks whether the client's certificate belongs to the same certificate chain."
[[menus.arguments]]
name = "tls-version"
type = "enum (any | only-1.2) { any:0, only-1.2:2 }"
description = "Specifies which TLS versions to allow."
[[menus.arguments]]
name = "auth"
type = "ubit (sha1, md5, sha256, sha384, sha512, null)"
description = "Authentication methods that the server accepts."
[[menus.arguments]]
name = "cipher"
type = "ubit (blowfish128, aes128-cbc, aes192-cbc, aes256-cbc, aes128-gcm, aes192-gcm, aes256-gcm, null)"
description = "Allowed ciphers."
[[menus.arguments]]
name = "reneg-sec"
type = "num"
description = "Encryption key re-negotiation interval in seconds. 0 disables re-negotiation."
[[menus.arguments]]
name = "redirect-gateway"
type = "ubit (disabled, def1, ipv6)"
description = "Specifies which routes the OVPN client must add to the routing table. `def1` - overrides the default gateway with 0.0.0.0/1 and 128.0.0.0/1 instead of 0.0.0.0/0. `disabled` - does not push redirect-gateway flags. `ipv6` - redirects IPv6 routing into the tunnel by adding 2000::/4 and 3000::/4 routes."
[[menus.arguments]]
name = "push-routes"
type = "string"
description = "Routes to push to the client. Maximum input is limited to 1400 characters or 37 routes. IPv6 support added in version 7.21."
[[menus.arguments]]
name = "push-routes-ipv6"
type = "string"
description = "IPv6 routes to push to the client."
[[menus.arguments]]
name = "enable-tun-ipv6"
type = "bool"
description = "Whether IPv6 tunneling is enabled for this OVPN server."
[[menus.arguments]]
