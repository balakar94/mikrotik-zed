[[menus]]
path = "/tool/netwatch"
type = "Directory"
[[menus.flags]]
name = "X"
description = "disabled"
[[menus.arguments]]
name = "name"
type = "string"
description = "The name of the Netwatch probe."
[[menus.arguments]]
name = "host"
type = "address (flags=46viD)"
description = "The IP address or domain name of the server to be probed. See [address flags](../../cli-reference/#address-flags)"
required = true
[[menus.arguments]]
name = "type"
type = "enum (simple | icmp | tcp-conn | http-get | https-get | dns)"
[[menus.arguments]]
name = "src-address"
type = "address (flags=46)"
description = "Source IP address which the Netwatch will try to use in order to reach the host. If the address is not configured on the router or was lost, then the host will be considered as \"down\". See [address flags](../../cli-reference/#address-flags)"
unset = true
[[menus.arguments]]
name = "interval"
type = "time"
description = "The time interval between probe tests. (default value: **10s**)"
unset = true
[[menus.arguments]]
name = "timeout"
type = "time"
description = "Max time limit to wait for a response. (default value: **3s**)"
unset = true
[[menus.arguments]]
name = "start-delay"
type = "time"
description = "Time to wait before starting the probe. (default value: **3s**) (on add, enable, or system startup in cases when \"startup-delay\" value is smaller then \"start-delay\" value)"
unset = true
[[menus.arguments]]
name = "startup-delay"
type = "time"
description = "Time to wait until starting the Netwatch probe after system startup. (default value: **5m**)"
unset = true
[[menus.arguments]]
name = "ignore-initial-up"
type = "bool"
description = "Specifies if \"Up\" script should be run if the probe state change goes from Unknown to \"Up\", used to help against false positives after enabling the probe, or after a reboot. \"no\" means that the change from \"Unknown\" to \"Up\" will not be ignored. (default value: **no**)"
unset = true
[[menus.arguments]]
name = "ignore-initial-down"
type = "bool"
description = "Specifies if \"Down\" script should be run if the probe state change goes from Unknown to \"Down\". \"no\" means that the change from \"Unknown\" to \"Down\" will not be ignored. (default value: **no**)  **Warning**: Should be used with care, as the first \"Down\" status won't be executed, and Down script will only be run if the probe goes from \"Up\" to \"Down\" state."
unset = true
[[menus.arguments]]
name = "up-script"
type = ""
[[menus.arguments]]
name = "down-script"
type = ""
[[menus.arguments]]
name = "test-script"
type = ""
[[menus.arguments]]
name = "packet-interval"
type = "time"
description = "The time between ICMP-request packet sends. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **50ms**)"
unset = true
[[menus.arguments]]
name = "packet-count"
type = "num"
description = "Total count of ICMP packets to send out within a single test. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **10**)"
unset = true
[[menus.arguments]]
name = "packet-size"
type = "num"
description = "Total size of the IP ICMP packet. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **50**)"
unset = true
[[menus.arguments]]
name = "ttl"
type = "num"
description = "Manually sets the time to live value for the ICMP packet. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **255**)"
unset = true
[[menus.arguments]]
name = "accept-icmp-time-exceeded"
type = "bool"
description = "If the ICMP \"time exceeded\" message should be considered a valid response. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **no**)"
unset = true
[[menus.arguments]]
name = "early-success-detection"
type = "bool"
description = "Netwatch will not wait for all the packets to be processed to change probe status if it is already known that the host will be considered \"Down\". This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **no**)"
unset = true
[[menus.arguments]]
name = "early-failure-detection"
type = "bool"
description = "Netwatch will not wait for all the packets to be processed to change probe status if it is already known that the host will be considered \"Down\". This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **no**)"
unset = true
[[menus.arguments]]
name = "thr-max"
type = "time"
description = "Fail threshold for rtt-max. (a value above thr-max is a probe fail) This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **1s**)"
unset = true
[[menus.arguments]]
name = "thr-avg"
type = "time"
description = "Fail threshold for rtt-avg. (round trip time-avg) This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **100ms**)"
unset = true
[[menus.arguments]]
name = "thr-stdev"
type = "time"
description = "Fail threshold for rtt-stdev. (standard deviation of round trip time) This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **250ms**)"
unset = true
[[menus.arguments]]
name = "thr-jitter"
type = "time"
description = "Fail threshold for rtt-jitter. (jitter ( = max - min) of round trip time) This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **1s**)"
unset = true
[[menus.arguments]]
name = "thr-loss-percent"
type = "num"
description = "Fail threshold for loss-percent. (number of lost packets in percent) This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **85%**)"
unset = true
[[menus.arguments]]
name = "thr-loss-count"
type = "num"
description = "Fail threshold for loss-count. (number of lost packets) This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type. (default value: **4294967295(max)**)"
unset = true
[[menus.arguments]]
name = "port"
type = "num"
description = "TCP port. This parameter is specific to the [**TCP-conn**](../../diagnostics-monitoring-and-troubleshooting/netwatch#tcp-conn-probe) and [**HTTP/S-GET**](../../diagnostics-monitoring-and-troubleshooting/netwatch#http-get-probe) probe types. (default value: **80** (TCP-conn, HTTP-GET) and  **443** (HTTPS-GET))"
unset = true
[[menus.arguments]]
name = "thr-tcp-conn-time"
type = "time"
description = "Fail threshold for tcp-connect-time, the configuration uses microseconds, if the time unit is not specified (s/m/h), log and status pages display the same value in milliseconds. This parameter is specific to the [**TCP-conn**](../../diagnostics-monitoring-and-troubleshooting/netwatch#tcp-conn-probe) probe type.(default value: **1s**)"
unset = true
[[menus.arguments]]
name = "thr-http-time"
type = "time"
description = "Fail threshold for http-resp-time. This parameter is specific to the [**HTTP/S-GET**](../../diagnostics-monitoring-and-troubleshooting/netwatch#http-get-probe) probe types. (default value: **10s**)"
unset = true
[[menus.arguments]]
name = "http-codes"
type = ""
[[menus.arguments]]
name = "certificate"
type = "enum (none) { none:0 }"
description = "Certificate from the local store that should be used for host verification. This parameter is specific to the [**HTTPS-GET**](../../diagnostics-monitoring-and-troubleshooting/netwatch#https-get-probe) probe type."
unset = true
[[menus.arguments]]
name = "check-certificate"
type = "bool"
description = "Enables trust chain validation from the local certificate store. This parameter is specific to the [**HTTPS-GET**](../../diagnostics-monitoring-and-troubleshooting/netwatch#https-get-probe) probe type. (default value: **no**)"
unset = true
[[menus.arguments]]
name = "record-type"
type = "enum (A | AAAA | MX | NS)"
description = "Record type that will be used for DNS probe. This parameter is specific to the [**DNS**](../../diagnostics-monitoring-and-troubleshooting/netwatch#dns-probe) probe type. (default value: **A**)"
unset = true
[[menus.arguments]]
name = "dns-server"
type = "address (flags=46)"
description = "The DNS server that the probe should send its requests to; if not specified, it will use the value from `/ip/dns`. This parameter is specific to the [**DNS**](../../diagnostics-monitoring-and-troubleshooting/netwatch#dns-probe) probe type. See [address flags](../../cli-reference/#address-flags)"
unset = true
[[menus.read_only]]
name = "status"
type = "enum (unknown | down | up)"
description = "Current status of the probe."
[[menus.read_only]]
name = "since"
type = "date"
description = "Last time the status change happened."
[[menus.read_only]]
name = "done-tests"
type = "num"
description = "Total number of completed probe tests."
[[menus.read_only]]
name = "failed-tests"
type = "num"
description = "Total number of failed probe tests."
[[menus.read_only]]
name = "sent-count"
type = "num"
description = "Amount of ICMP packets sent out during last probe test. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "response-count"
type = "num"
description = "Amount of ICMP response packets received during last probe test. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "loss-count"
type = "num"
description = "Amount of lost ICMP response packets during last probe test. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "loss-percent"
type = "num"
description = "Percent of lost ICMP response packets during last probe test. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "rtt-avg"
type = "time"
description = "Mean value of round trip time. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "rtt-min"
type = "time"
description = "Minimal round trip time. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "rtt-max"
type = "time"
description = "Maximum round trip time. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "rtt-jitter"
type = "time"
description = "Jitter ( = max - min) of round trip time. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
name = "rtt-stdev"
type = "time"
description = "Standard deviation of round trip time. This parameter is specific to the [**ICMP**](../../diagnostics-monitoring-and-troubleshooting/netwatch#icmp-probe) probe type."
[[menus.read_only]]
