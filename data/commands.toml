[[menus]]
path = "/tool/ping"
type = "Command"
[[menus.arguments]]
name = "address"
type = "address (flags=46v%Dm)"
description = "IP address or DNS name of the target host. See [address flags](../../cli-reference/#address-flags)"
[[menus.arguments]]
name = "interval"
type = "time"
description = "Time interval between ICMP echo requests"
[[menus.arguments]]
name = "size"
type = "num"
description = "Size of the ICMP data payload in bytes"
[[menus.arguments]]
name = "ttl"
type = "num"
description = "Time to Live value for the ICMP packet"
[[menus.arguments]]
name = "dscp"
type = "num"
description = "DSCP value to set in the IP header for QoS marking"
[[menus.arguments]]
name = "do-not-fragment"
type = "switch"
description = "Set the Don't Fragment flag in the IP header"
[[menus.arguments]]
name = "src-address"
type = ""
[[menus.arguments]]
name = "arp-ping"
type = "bool"
description = "Use ARP requests instead of ICMP echo to discover hosts"
[[menus.arguments]]
name = "count"
type = "num"
description = "Number of ICMP echo requests to send"
[[menus.arguments]]
name = "nd-ping"
type = "bool"
[[menus.arguments]]
name = "interface"
type = "iface_enum"
description = "Interface to send the ping through"
[[menus.arguments]]
name = "vrf"
type = "enum"
description = "VRF table to use for routing the ping request"
[[menus.read_only]]
name = "seq"
type = "num"
description = "Sequence number of the ping response"
[[menus.read_only]]
name = "host"
type = ""
[[menus.read_only]]
name = "size"
type = "num"
description = "Size of the received ICMP packet in bytes"
[[menus.read_only]]
name = "ttl"
type = "num"
description = "Time to Live value from the received packet"
[[menus.read_only]]
name = "time"
type = "time"
description = "Round-trip time of the ping probe"
[[menus.read_only]]
name = "status"
type = "string"
description = "Status of the ping response"
[[menus.read_only]]
name = "sent"
type = "num"
description = "Total number of ICMP echo requests sent"
[[menus.read_only]]
name = "received"
type = "num"
description = "Total number of ICMP echo replies received"
[[menus.read_only]]
name = "packet-loss"
type = "num"
description = "Percentage of lost packets"
[[menus.read_only]]
name = "min-rtt"
type = "time"
description = "Minimum measured round-trip time"
[[menus.read_only]]
name = "avg-rtt"
type = "time"
description = "Average measured round-trip time"
[[menus.read_only]]
name = "max-rtt"
type = "time"
description = "Maximum measured round-trip time"

