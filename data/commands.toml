type = "iface_enum { :0, none:0, self }"
description = "deprecated."
[[menus.arguments]]
name = "group-authority"
type = "iface_enum { :0, none:0, self }"
[[menus.arguments]]
name = "vrid"
type = "num"
description = "Virtual Router identifier. Each Virtual router must have a unique id number."
[[menus.arguments]]
name = "priority"
type = "num"
description = "Priority of VRRP node used in Master election algorithm. A higher number means higher priority. `255` is reserved for the router that owns the VR IP and `0` is reserved for the Master router to indicate that it is releasing responsibility."
[[menus.arguments]]
name = "interval"
type = "time"
[[menus.arguments]]
name = "preemption-mode"
type = "bool"
description = "Whether the master node always has the priority. When set to `no` the backup node will not be elected to be a master until the current master fails, even if the backup node has higher priority."
