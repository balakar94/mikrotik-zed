required = true
[[menus.arguments]]
name = "pcp"
type = "num"
description = "VLAN priority value (IEEE 802.1q PCP - Priority Code Point). Used only if the egress packets assigned to the QoS profile are VLAN-tagged (have the 802.1q header). The value can be further altered via the QoS Egress Map."
[[menus.arguments]]
name = "dscp"
type = "num"
description = "IPv4/IPv6 DSCP field value for the egress packets assigned to the QoS profile."
[[menus.arguments]]
name = "traffic-class"
type = "num"
description = "The traffic class determines the packet priority and the egress queue. The queue number is usually the same as the traffic class (packets with tc0 go into queue0, tc1 - queue1, ... tc7 - queue7). TC0 always selects the lowest priority."
[[menus.arguments]]
name = "automap"
type = "bool"
description = "Automatically maps packets with matching PCP or DSCP values to this QoS profile. Only applies to **trusted** ports."
[[menus.read_only]]
name = "hw-id"
type = "num"

[[menus]]
path = "/interface/ethernet/switch/qos/settings"
type = "Settings Directory"
[[menus.arguments]]
name = "multicast-buffers"
type = "num"
description = "Maximum amount of packet buffers for multicast traffic (% of total buffer memory)."
[[menus.arguments]]
name = "mirror-buffers"
type = "num"
description = "Maximum number of packet buffers for [mirrored](../../../../../bridging-and-switching/marvell-prestera-switch-chip-features.md#mirroring) traffic (% of the total buffer memory)."
[[menus.arguments]]
name = "mirror-profile"
type = "enum"
description = "The name of the [QoS profile](./profile.md) to assign to the [mirrored](../../../../../bridging-and-switching/marvell-prestera-switch-chip-features.md#mirroring) packets."
[[menus.arguments]]
name = "shared-buffers"
type = "num"
[[menus.arguments]]
name = "lossless-buffers"
type = "num"
description = "If the device supports multiple shared buffer pools, this setting allows adjusting the size of the lossless pool (% of the shared buffer memory, where 100% means all shared buffers allocated by the `shared-buffers` setting). For example, if shared-buffers=50 and lossless-buffers=80, the lossless pool receives 40% of the total buffer memory (80% of 50% or \"0.8 * 0.5 = 0.4\"), and the lossy pool receives the remaining 10% of shared buffers."
[[menus.arguments]]
name = "lossless-traffic-class"
type = ""
[[menus.arguments]]
name = "wred-threshold"
type = "enum (low | medium | high) { low:1, medium:2, high:3 }"
description = "A relative number of packets above a shared queue cap (`queueX-shared-packet-cap` or `queueX-shared-byte-cap`) where random drops take place. This threshold is applied only to queues with enabled [Weighted Random Early Detection](../../../../../bridging-and-switching/quality-of-service.md#weighted-random-early-detection-wred) (`wred=yes`) that use shared buffers (`use-shared-buffers=yes`). The higher the queue buffer fill level, the higher the packet drop chance. The `low` threshold means the random tail drop starts later; the `high` - sooner."

