[[menus]]
path = "/interface/vrrp"
type = "Directory"
[[menus.flags]]
name = "X"
description = "The VRRP interface is disabled by the user."
[[menus.flags]]
name = "I"
description = "The VRRP interface is in the invalid state, for example due to a configuration error."
[[menus.flags]]
name = "G"
description = "The VRRP interface is `group-authority`. It controls the state of the other group members and is the only interface that sends VRRP advertisements."
[[menus.flags]]
name = "g"
description = "The VRRP interface is a group member. Its state machine follows the state of the specified `group-authority` interface."
[[menus.flags]]
name = "R"
description = "running."
[[menus.flags]]
name = "M"
description = "The VRRP interface is in the master state."
[[menus.flags]]
name = "B"
description = "The VRRP interface is in the backup state."
[[menus.flags]]
name = "F"
description = "The VRRP interface is in the failure state, for example due to a link-down on its parent interface."
[[menus.arguments]]
name = "name"
type = "string"
description = "VRRP interface name."
[[menus.arguments]]
name = "arp"
type = "enum (disabled | enabled | proxy-arp | reply-only | local-proxy-arp) { disabled:0, enabled:1, pro..."
description = "[Address Resolution Protocol](../../getting-started/networking-fundamentals/index.md#arp-and-tying-it-all-together) mode."
[[menus.arguments]]
name = "arp-timeout"
type = ""
[[menus.arguments]]
name = "interface"
type = "iface_enum"
description = "Interface name on which VRRP instance will be running."
required = true
[[menus.arguments]]
