description = "Whether the interface is running."
[[menus.arguments]]
name = "name"
type = "string"
description = "Name of the tunnel."
[[menus.arguments]]
name = "mtu"
type = "num"
description = "Layer3 maximum transmission unit."
[[menus.arguments]]
name = "local-address"
type = "ipAddr"
description = "IP address used for the local tunnel end. If set to 0.0.0.0, the IP address of the outgoing interface is used."
[[menus.arguments]]
name = "remote-address"
type = "address (flags=4Dv)"
description = "IP address of the remote tunnel end."
required = true
[[menus.arguments]]
name = "keepalive"
type = ""
[[menus.arguments]]
name = "dscp"
type = "num"
description = "DSCP value of the packet. Inherited means the DSCP value is inherited from the tunneled traffic."
[[menus.arguments]]
name = "clamp-tcp-mss"
type = "bool"
description = "Controls whether to change the MSS size for received TCP SYN packets. When enabled, the router changes the MSS size for received TCP SYN packets if the current MSS size exceeds the tunnel interface MTU (taking into account the TCP/IP overhead). The received encapsulated packet still contains the original MSS, and only after decapsulation the MSS is changed."
[[menus.arguments]]
name = "dont-fragment"
type = "bool"
[[menus.arguments]]
name = "ipsec-secret"
type = "string"
description = "When a secret is specified, the router adds a dynamic IPsec peer to remote-address with a pre-shared key and policy (by default phase2 uses sha1/aes128cbc)."
[[menus.arguments]]
name = "allow-fast-path"
type = "bool"
description = "Whether to allow FastPath processing. Must be disabled if IPsec tunneling is used."
[[menus.read_only]]
name = "actual-mtu"
type = "num"
description = "Actual maximum transmission unit of the tunnel."
[[menus.read_only]]
name = "current-remote-address"
type = "ipAddr"
description = "Current IP address of the remote end."

