[[menus]]
path = "/interface/ethernet/switch/l3hw-settings"
type = "Settings Directory"
[[menus.arguments]]
name = "autorestart"
type = "bool"
description = "Automatically restarts L3HW in case of driver failure. If autorestart is not enabled, then `l3-hw-offloading` gets disabled, and the error code is displayed in the [monitor](./monitor). Autorestart does not work for system failures, such as OOM (Out Of Memory)."
[[menus.arguments]]
name = "fasttrack-hw"
type = "bool"
description = "Enables or disables FastTrack HW Offloading. Keep it enabled unless HW TCAM memory reservation is required, e.g., for dynamic switch ACL rules creation. Not all switch chips support FastTrack HW Offloading (see [`hw-supports-fasttrack`](#hw-supports-fasttrack))."
[[menus.arguments]]
name = "ipv6-hw"
type = "bool"
description = "IPv6 hardware offloading. IPv6 routes occupy a lot of HW memory, enable this option only if IPv6 traffic is significant enough to benefit from hardware routing."
[[menus.arguments]]
name = "icmp-reply-on-error"
type = "bool"
description = "Since the hardware cannot send ICMP messages, the packet must be redirected to the CPU to send an ICMP reply in case of an error (e.g., \"Time Exceeded\", \"Fragmentation required\", etc.). Enabling helps with network diagnostics but may open potential vulnerabilities for DDoS attacks. Disabling silently drops the packets on the hardware level in case of an error."
[[menus.read_only]]
name = "hw-supports-fasttrack"
type = "bool"
description = "Indicates if the hardware (switch chip) supports FastTrack HW Offloading."

[[menus]]
path = "/interface/ethernet/switch/l3hw-settings/advanced"
type = "Settings Directory"
[[menus.arguments]]
name = "route-queue-limit-high"
type = "num"
description = "The switch driver stops route indexing when [`route-queue-size`](../monitor#route-queue-size) exceeds this value. Lowering this value leads to faster route processing but increases the lag between a route's appearance in RouterOS and hardware memory. Setting **0** disables route indexing when there are any routes in the processing queue - the most efficient CPU usage but the longest delay before hardware offloading. Useful when there are static routes only. Not recommended together with routing protocols (such as BGP or OSPF) when there are frequent routing table changes."
[[menus.arguments]]
name = "route-queue-limit-low"
type = "num"
description = "Re-enable route indexing when [`route-queue-size`](../monitor#route-queue-size) drops down to this value. Must not exceed the high limit. Setting **0** tells the switch driver to process all pending routes before the next hw-offloading attempt. While this is the desired behavior, it may completely block the hw-offloading under a constant BGP feed."
[[menus.arguments]]
name = "shwp-reset-counter"
type = "num"
[[menus.arguments]]
name = "partial-offload-chunk"
type = "num"
[[menus.arguments]]
name = "route-index-delay-min"
type = "time"
[[menus.arguments]]
name = "route-index-delay-max"
type = "time"
description = "The maximum delay between route processing and its offloading. When the maximum delay is reached, the processed routes get offloaded despite more routes pending. However, `route-queue-limit-high` has higher priority than this, meaning that the indexing/offloading gets paused anyway when a certain queue size is reached."
[[menus.arguments]]
name = "neigh-keepalive-interval"
type = "time"
description = "Neighbor (host) keepalive interval. When a host gets hw-offloaded, all traffic from/to it is routed by the switch chip, and RouterOS may think the neighbor is inactive and delete it. To prevent that, the switch driver must keep the offloaded neighbors alive by sending periodic refreshes to RouterOS."
[[menus.arguments]]
name = "neigh-discovery-interval"
type = "time"
[[menus.arguments]]
name = "neigh-discovery-burst-limit"
type = "num"
description = "The maximum number of ARP/ND requests that can be sent at once."
[[menus.arguments]]
name = "neigh-discovery-burst-delay"
type = "time"
description = "The delay between ARP/ND subsequent bursts if the number of requests exceeds `neigh-discovery-burst-limit`."
[[menus.arguments]]
name = "neigh-dump-retries"
type = "num"
description = "The maximum retry count to offload a neighbor table in case of failure."

[[menus]]
path = "/interface/ethernet/switch/l3hw-settings/advanced/monitor"
type = "Command"
[[menus.read_only]]
name = "error-code"
type = "num"
description = "Error code when L3HW driver is in a failure state."
[[menus.read_only]]
name = "state"
type = "enum (ok | stopping | starting | fib-failure | net-failure | switch-failure | fasttrack-failure |..."
description = "Current state of the L3HW driver."
[[menus.read_only]]
name = "ipv4-routes-total"
type = "num"
description = "The total number of IPv4 routes handled by the switch driver."
[[menus.read_only]]
name = "ipv4-routes-hw"
type = "num"
description = "The number of hardware-offloaded IPv4 routes (a.k.a. hardware routes)."
[[menus.read_only]]
name = "ipv4-routes-cpu"
type = "num"
description = "The number of IPv4 routes redirected to the CPU (a.k.a. software routes)."
[[menus.read_only]]
name = "ipv4-shortest-hw-prefix"
type = "num"
description = "**Shortest Hardware Prefix (SHWP)** for IPv4. If the entire IPv4 routing table does not fit into the hardware memory, **partial offloading** is applied, where the longest prefixes are hw-offloaded while the shorter ones are redirected to the CPU. This field shows the shortest route prefix (/x) that is offloaded to the hardware memory. All prefixes shorter than this are processed by the CPU. `ipv4-shortest-hw-prefix=0` means the entire IPv4 routing table is offloaded to the hardware memory."
[[menus.read_only]]
name = "ipv4-hosts"
type = "num"
description = "The number of hardware-offloaded IPv4 hosts (/32 routes)."
[[menus.read_only]]
name = "ipv6-routes-total"
type = "num"
description = "The total number of IPv6 routes handled by the switch driver."
[[menus.read_only]]
name = "ipv6-routes-hw"
type = "num"
description = "The number of hardware-offloaded IPv6 routes (a.k.a. hardware routes). Shown only when IPv6 hardware routing is enabled (`ipv6-hw=yes`)."
[[menus.read_only]]
name = "ipv6-routes-cpu"
type = "num"
description = "The number of IPv6 routes redirected to the CPU (a.k.a. software routes). Shown only when IPv6 hardware routing is enabled (`ipv6-hw=yes`)."
[[menus.read_only]]
name = "ipv6-shortest-hw-prefix"
type = "num"
description = "**Shortest Hardware Prefix (SHWP)** for IPv6. If the entire IPv6 routing table does not fit into the hardware memory, **partial offloading** is applied, where the longest prefixes are hw-offloaded while the shorter ones are redirected to the CPU. This field shows the shortest route prefix (/x) that is offloaded to the hardware memory. All prefixes shorter than this are processed by the CPU. `ipv6-shortest-hw-prefix=0` means the entire IPv6 routing table is offloaded to the hardware memory. Shown only when IPv6 hardware routing is enabled (`ipv6-hw=yes`)."
[[menus.read_only]]
name = "ipv6-hosts"
type = "num"
description = "The number of hardware-offloaded IPv6 hosts (/128 routes). Shown only when IPv6 hardware routing is enabled (`ipv6-hw=yes`)."
[[menus.read_only]]
name = "route-queue-size"
type = "num"
description = "The number of routes in the queue for processing by the switch chip driver. Under normal working conditions, this field is 0, meaning that all routes are processed by the driver."
[[menus.read_only]]
name = "route-queue-rate"
type = "num"
description = "The rate at which routes are added to the queue for processing by the switch driver (growth rate of `route-queue-size` routes per second)."
[[menus.read_only]]
name = "route-process-rate"
type = "num"
description = "The rate at which previously queued routes are processed by the switch driver (shrink rate of `route-queue-size` routes per second).."
[[menus.read_only]]
name = "nexthop-cap"
type = "num"
description = "The nexthop capacity."
[[menus.read_only]]
name = "nexthop-usage"
type = "num"
description = "The number of currently used nexthops."
[[menus.read_only]]
name = "vxlan-mtu-packet-drop"
type = "num"
description = "The number of dropped VXLAN packets due to exceeded interface MTU settings."
[[menus.read_only]]
name = "fasttrack-ipv4-conns"
type = "num"
description = "The number of hardware-offloaded FastTrack connections. Parammeter appear only when hardware offloading of FastTrack connections is enabled."
[[menus.read_only]]
name = "fasttrack-queue-size"
type = "num"
description = "The number of FastTrack connections in the queue for processing by the switch chip driver."
[[menus.read_only]]
name = "fasttrack-queue-rate"
type = "num"
description = "The rate at which FastTrack connections are added to the queue for processing by the switch driver (growth rate of `fasttrack-queue-size` connections per second)."
[[menus.read_only]]
name = "fasttrack-process-rate"
type = "num"
description = "The rate at which previously queued FastTrack connections are processed by the switch driver (shrink rate of `fasttrack-queue-size` connections per second)."
[[menus.read_only]]
name = "fasttrack-hw-min-speed"
type = "num"
description = "When the hardware memory for storing FastTrack is full, this field shows the minimum speed (in bytes per second) of a hw-offloaded FastTrack connection. Parammeter appear only when hardware offloading of FastTrack connections is enabled."
[[menus.read_only]]
name = "fasttrack-hw-offloaded"
type = "num"
description = "The number of FastTrack connections offloaded to the hardware. The counter resets every second."
[[menus.read_only]]
name = "fasttrack-hw-unloaded"
type = "num"
description = "The number of FastTrack connections unloaded from the hardware (redirected to software routing). The counter resets every second."
[[menus.read_only]]
name = "lpm-cap"
type = "num"
description = "The size of the LPM hardware table (LPM = Longest Prefix Match). LPM stores route indexes for hardware routing. Not every switch chip model uses LPM. Others use TCAM."
[[menus.read_only]]
name = "lpm-usage"
type = "num"
description = "The number of used LPM blocks."
[[menus.read_only]]
name = "lpm-bank-cap"
type = "num"
description = "LPM memory is organized in banks. This value shows the size of a single bank (in LPM blocks). The bank size depends on the switch chip model. lpm-cap / lpm-bank-cap = the number of banks."
[[menus.read_only]]
name = "lpm-bank-usage"
type = ""
[[menus.read_only]]
name = "pbr-cap"
type = "num"
description = "The size of the Policy-Based Routing (PBR) hardware table. PBR is used for NAT offloading of FastTrack connections."
[[menus.read_only]]
name = "pbr-usage"
type = "num"
description = "The number of used PBR entries."
[[menus.read_only]]
name = "pbr-lpm-bank"
type = "num"
description = "PBR shares LPM memory banks with routing tables. This value shows the LPM bank index shared with PBR (0 = the first bank)."
[[menus.read_only]]
name = "nat-usage"
type = "num"
description = "The number of used NAT hardware entries (for FastTrack connections)."

[[menus]]
path = "/interface/ethernet/switch/l3hw-settings/monitor"
type = "Command"
[[menus.read_only]]
name = "state"
type = "enum (ok | stopping | starting | fib-failure | net-failure | switch-failure | fasttrack-failure |..."
description = "Current state of the L3HW driver."
[[menus.read_only]]
name = "ipv4-routes-total"
type = "num"
description = "The total number of IPv4 routes handled by the switch driver."
[[menus.read_only]]
name = "ipv4-routes-hw"
type = "num"
description = "The number of hardware-offloaded IPv4 routes."
[[menus.read_only]]
name = "ipv4-routes-cpu"
type = "num"
description = "The number of IPv4 routes redirected to the CPU."
[[menus.read_only]]
name = "ipv4-shortest-hw-prefix"
type = "num"
description = "**Shortest Hardware Prefix (SHWP)** for IPv4. If the entire IPv4 routing table does not fit into the hardware memory, **partial offloading** is applied, where the longest prefixes are hw-offloaded while the shorter ones are redirected to the CPU. This field shows the shortest route prefix (/x) that is offloaded to the hardware memory. All prefixes shorter than this are processed by the CPU. `ipv4-shortest-hw-prefix=0` means the entire IPv4 routing table is offloaded to the hardware memory."
[[menus.read_only]]
name = "ipv4-hosts"
type = "num"
description = "The number of hardware-offloaded IPv4 hosts (/32 routes)."
[[menus.read_only]]
name = "ipv6-routes-total"
type = "num"
description = "The total number of IPv6 routes handled by the switch driver."
[[menus.read_only]]
name = "ipv6-routes-hw"
type = "num"
description = "The number of hardware-offloaded IPv6 routes (a.k.a. hardware routes). Shown only when IPv6 hardware routing is enabled (`ipv6-hw=yes`)."
[[menus.read_only]]
name = "ipv6-routes-cpu"
type = "num"
description = "The number of IPv6 routes redirected to the CPU (a.k.a. software routes). Shown only when IPv6 hardware routing is enabled (`ipv6-hw=yes`)."
[[menus.read_only]]
name = "ipv6-shortest-hw-prefix"
type = "num"
description = "**Shortest Hardware Prefix (SHWP)** for IPv6. If the entire IPv6 routing table does not fit into the hardware memory, **partial offloading** is applied, where the longest prefixes are hw-offloaded while the shorter ones are redirected to the CPU. This field shows the shortest route prefix (/x) that is offloaded to the hardware memory. All prefixes shorter than this are processed by the CPU. `ipv6-shortest-hw-prefix=0` means the entire IPv6 routing table is offloaded to the hardware memory. Shown only when IPv6 hardware routing is enabled (`ipv6-hw=yes`)."
[[menus.read_only]]
name = "ipv6-hosts"
type = "num"
description = "The number of hardware-offloaded IPv6 hosts (/128 routes)."
[[menus.read_only]]
name = "route-queue-size"
type = "num"
description = "The number of routes in the queue for processing by the switch chip driver. Under normal working conditions, this field is 0, meaning that all routes are processed by the driver."
[[menus.read_only]]
name = "nexthop-cap"
type = "num"
description = "The nexthop capacity."
[[menus.read_only]]
name = "nexthop-usage"
type = "num"
description = "The number of currently used nexthops."
[[menus.read_only]]
name = "vxlan-mtu-packet-drop"
type = "num"
description = "The number of dropped VXLAN packets due to exceeded interface MTU settings."
[[menus.read_only]]
name = "fasttrack-ipv4-conns"
type = "num"
description = "The number of hardware-offloaded FastTrack connections. Parammeter appear only when hardware offloading of FastTrack connections is enabled."
[[menus.read_only]]
name = "fasttrack-hw-min-speed"
type = "num"
description = "When the hardware memory for storing FastTrack is full, this field shows the minimum speed (in bytes per second) of a hw-offloaded FastTrack connection. Parammeter appear only when hardware offloading of FastTrack connections is enabled."

