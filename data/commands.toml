[[menus]]
path = "/interface/eoip"
type = "Directory"
[[menus.flags]]
name = "X"
description = "Whether an item is disabled."
[[menus.flags]]
name = "R"
description = "Whether the interface is running."
[[menus.arguments]]
name = "name"
type = "string"
description = "Interface name."
[[menus.arguments]]
name = "mtu"
type = "num"
description = "Layer3 maximum transmission unit."
[[menus.arguments]]
name = "mac-address"
type = "macAddr"
description = "Media Access Control number of an interface. The address numeration authority IANA allows the use of MAC addresses in the range from 00:00:5E:80:00:00 - 00:00:5E:FF:FF:FF freely."
[[menus.arguments]]
name = "local-address"
type = "ipAddr"
description = "Source address of the tunnel packets, local to the router."
[[menus.arguments]]
name = "remote-address"
type = "address (flags=4Dv)"
description = "IP address of the remote end of the EoIP tunnel."
required = true
[[menus.arguments]]
name = "tunnel-id"
type = "num"
description = "Unique tunnel identifier, which must match the other side of the tunnel."
required = true
[[menus.arguments]]
name = "keepalive"
type = ""
[[menus.arguments]]
name = "dscp"
type = "num"
description = "DSCP value of the packet. Inherited means the DSCP value is inherited from the packet to be encapsulated."
[[menus.arguments]]
name = "clamp-tcp-mss"
type = "bool"
description = "Controls whether to change MSS size for received TCP SYN packets. When enabled, the router changes the MSS size for received TCP SYN packets if the current MSS size exceeds the tunnel interface MTU (taking into account the TCP/IP overhead). The received encapsulated packet still contains the original MSS, and only after decapsulation the MSS is changed."
[[menus.arguments]]
name = "dont-fragment"
type = "bool"
[[menus.arguments]]
name = "ipsec-secret"
type = "string"
description = "When a secret is specified, the router adds a dynamic IPsec peer to remote-address with a pre-shared key and policy (by default phase2 uses sha1/aes128cbc)."
[[menus.arguments]]
name = "allow-fast-path"
type = "bool"
description = "Whether to allow FastPath processing. Must be disabled if IPsec tunneling is used."
[[menus.arguments]]
name = "arp"
type = "enum (disabled | enabled | proxy-arp | reply-only | local-proxy-arp) { disabled:0, enabled:1, pro..."
description = "[Address Resolution Protocol](../../getting-started/networking-fundamentals/index.md#arp-and-tying-it-all-together) mode."
[[menus.arguments]]
name = "arp-timeout"
type = ""
[[menus.arguments]]
name = "arp-accept"
type = "bool"
description = "Whether to accept gratuitous ARP replies."
[[menus.arguments]]
name = "loop-protect"
type = "enum (default | off | on) { default:0, off:1, on:2 }"
description = "Enables or disables loop protect on the selected interface. `default` works as turned off."
[[menus.arguments]]
name = "loop-protect-send-interval"
type = "time"
description = "Sets how often loop protect packets are sent on the selected interface."
[[menus.arguments]]
name = "loop-protect-disable-time"
type = "time"
description = "Sets how long the selected interface is disabled when a loop is detected."
[[menus.read_only]]
name = "actual-mtu"
type = "num"
description = "Actual maximum transmission unit of the tunnel."
[[menus.read_only]]
name = "l2mtu"
type = "num"
description = "[Layer2 maximum transmission unit](../../hardware/mtu-in-routeros.md). Not configurable for EoIP."
[[menus.read_only]]
name = "current-remote-address"
type = "ipAddr"
description = "Current IPv4 address of the remote end."
[[menus.read_only]]
name = "loop-protect-status"
type = "enum (off | on | disabled) { off:1, on:2, disabled:3 }"

