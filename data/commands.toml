[[menus]]
path = "/interface/ethernet/switch/port"
type = "Directory"
[[menus.flags]]
name = "I"
description = ""
[[menus.arguments]]
name = "ingress-customer-tpid-override"
type = "num"
description = "Ingress customer TPID override allows accepting specific frames with a custom customer tag TPID. The default value is for the tag of 802.1Q frames."
[[menus.arguments]]
name = "egress-customer-tpid-override"
type = "num"
description = "Egress customer TPID override allows custom identification for egress frames with a customer tag. The default value is for the tag of 802.1Q frames."
[[menus.arguments]]
name = "ingress-service-tpid-override"
type = "num"
description = "Ingress service TPID override allows accepting specific frames with a custom service tag TPID. The default value is for the service tag of 802.1AD frames."
[[menus.arguments]]
name = "egress-service-tpid-override"
type = "num"
description = "Egress service TPID override allows custom identification for egress frames with a service tag. The default value is for the service tag of 802.1AD frames."
[[menus.arguments]]
name = "drop-secure-static-mac-move"
type = "bool"
description = "Prevents MAC relearning of static entries until UFDB timeout if the MAC is already learned on another port."
[[menus.arguments]]
name = "drop-dynamic-mac-move"
type = "bool"
description = "Prevents MAC relearning until UFDB timeout if the MAC is already learned on another port."
[[menus.arguments]]
name = "learn-limit"
type = "num"
description = "Enable or disable MAC address learning and set the MAC limit on the port. MAC learning limit is disabled by default."
[[menus.arguments]]
name = "allow-unicast-loopback"
type = "bool"
description = "Unicast loopback on port. When enabled, it permits sending back when the source port and destination port are the same for known unicast packets."
[[menus.arguments]]
name = "allow-multicast-loopback"
type = "bool"
description = "Multicast loopback on port. When enabled, it permits sending back when the source port and destination port are the same for registered multicast or broadcast packets."
[[menus.arguments]]
name = "action-on-static-station-move"
type = "enum (forward | redirect-to-cpu | copy-to-cpu | drop) { forward:0, redirect-to-cpu:1, copy-to-cpu..."
description = "Action for packets when UFDB already contains a static entry with such a MAC but with a different port."
[[menus.arguments]]
name = "drop-when-ufdb-entry-src-drop"
type = "bool"
description = "Enable or disable dropping packets when UFDB entry has action src-drop."
[[menus.arguments]]
name = "isolation-leakage-profile-override"
type = "num"
[[menus.arguments]]
name = "vlan-type"
type = "enum (edge-port | network-port) { edge-port:0, network-port:1 }"
description = "Port VLAN type specifies whether VLAN ID is used in UFDB learning. The network port learns VLAN ID in UFDB, edge port does not - VLAN 0. It can be observed only in IVL learning mode."
[[menus.arguments]]
name = "allow-fdb-based-vlan-translate"
type = "bool"
description = "Enable or disable MAC-based VLAN translation on the port."
[[menus.arguments]]
name = "allow-mac-based-service-vlan-assignment-for"
type = "enum (none | untagged-and-priority-tagged-frame-only | tagged-frame-only | all) { none:0, untagge..."
description = "Frame type for which MAC-based service VLAN translation applies."
[[menus.arguments]]
name = "allow-mac-based-customer-vlan-assignment-for"
type = "enum (none | untagged-and-priority-tagged-frame-only | tagged-frame-only | all) { none:0, untagge..."
description = "Frame type for which MAC-based customer VLAN translation applies."
[[menus.arguments]]
name = "filter-untagged-frame"
type = "bool"
description = "Whether to filter untagged frames on the port."
[[menus.arguments]]
name = "filter-priority-tagged-frame"
type = "bool"
description = "Whether to filter tagged frames with priority on the port."
[[menus.arguments]]
