[[menus]]
path = "/interface/ethernet/switch"
type = "Settings Directory"
[[menus.arguments]]
name = "name"
type = "string"
description = "Name of the switch."
[[menus.arguments]]
name = "bridge-type"
type = "enum (customer-vid-used-as-lookup-vid | service-vid-used-as-lookup-vid) { customer-vid-used-as-lo..."
description = "Defines which VLAN tag is used as Lookup-VID. Lookup-VID serves as the VLAN key for all VLAN-based lookups."
[[menus.arguments]]
name = "drop-if-no-vlan-assignment-on-ports"
type = "multi { array-id }"
description = "Ports which drop frames if no MAC-based, Protocol-based VLAN assignment or Ingress VLAN Translation is applied."
[[menus.arguments]]
name = "drop-if-invalid-or-src-port-not-member-of-vlan-on-ports"
type = ""
[[menus.arguments]]
name = "unknown-vlan-lookup-mode"
type = "enum (ivl | svl)"
[[menus.arguments]]
name = "forward-unknown-vlan"
type = "bool"
description = "Whether to allow forwarding VLANs that are not members of the VLAN table."
[[menus.arguments]]
name = "use-svid-in-one2one-vlan-lookup"
type = "bool"
description = "Whether to use service VLAN ID for 1:1 VLAN switching lookup."
[[menus.arguments]]
name = "use-cvid-in-one2one-vlan-lookup"
type = "bool"
description = "Whether to use customer VLAN ID for 1:1 VLAN switching lookup."
[[menus.arguments]]
name = "mac-level-isolation"
type = "bool"
description = "Globally enables or disables MAC level isolation. Once enabled, the switch will check the source and destination MAC address entries and their `isolation-profile` from the unicast forwarding table. By default, the switch will learn MAC addresses and place them into a `promiscuous` isolation profile. Other isolation profiles can be used when creating static unicast entries. If the source or destination MAC address is located on a `promiscuous` isolation profile, the packet is forwarded. If both source and destination MAC addresses are located on the same `community1` or `community2` isolation profile, the packet is forwarded. The packet is dropped when the source and destination MAC address isolation profile is `isolated`, or when the source and destination MAC address isolation profiles are from different communities (e.g. source MAC address is `community1` and destination MAC address is `community2`). When MAC level isolation is globally disabled, the isolation is bypassed."
[[menus.arguments]]
name = "multicast-lookup-mode"
type = "enum (dst-mac-and-vid-always | dst-ip-and-vid-for-ipv4) { dst-mac-and-vid-always:0, dst-ip-and-vi..."
[[menus.arguments]]
name = "override-existing-when-ufdb-full"
type = "bool"
description = "Enable or disable overriding an existing entry which has the lowest aging value when UFDB is full."
[[menus.arguments]]
name = "unicast-fdb-timeout"
type = "time"
description = "Timeout for Unicast FDB entries."
[[menus.arguments]]
name = "ingress-mirror0"
type = ""
[[menus.arguments]]
name = "ingress-mirror1"
type = ""
[[menus.arguments]]
name = "ingress-mirror-ratio"
type = "enum (1/1 | 1/2 | 1/4 | 1/8 | 1/16 | 1/32 | 1/64 | 1/128 | 1/256 | 1/512 | 1/1024 | 1/2048 | 1/40..."
description = "The proportion of ingress mirrored packets compared to all packets."
[[menus.arguments]]
name = "egress-mirror0"
type = ""
[[menus.arguments]]
name = "egress-mirror1"
type = ""
[[menus.arguments]]
name = "egress-mirror-ratio"
type = "enum (1/1 | 1/2 | 1/4 | 1/8 | 1/16 | 1/32 | 1/64 | 1/128 | 1/256 | 1/512 | 1/1024 | 1/2048 | 1/40..."
description = "The proportion of egress mirrored packets compared to all packets."
[[menus.arguments]]
name = "fdb-uses"
type = "enum (mirror0 | mirror1) { mirror0:0, mirror1:1 }"
description = "Analyzer port used for FDB-based mirroring."
[[menus.arguments]]
name = "vlan-uses"
type = "enum (mirror0 | mirror1) { mirror0:0, mirror1:1 }"
description = "Analyzer port used for VLAN-based mirroring."
[[menus.arguments]]
name = "mirror-egress-if-ingress-mirrored"
type = "bool"
description = "When a packet is applied to both ingress and egress mirroring, only ingress mirroring is performed on the packet, if this setting is disabled. If enabled, both mirroring types are applied."
[[menus.arguments]]
name = "mirror-tx-on-mirror-port"
type = "bool"
[[menus.arguments]]
name = "mirrored-packet-qos-priority"
type = "num"
description = "Remarked priority in mirrored packets."
[[menus.arguments]]
name = "mirrored-packet-drop-precedence"
type = "enum (green | yellow | red | drop)"
description = "Remarked drop precedence in mirrored packets. This QoS attribute is used for mirrored packet enqueuing or dropping."
[[menus.arguments]]
name = "bypass-vlan-ingress-filter-for"
type = "ubit (eapol, ripv1, dhcpv4, dhcpv6, igmp, mld, arp, nd, pppoe-discovery)"
description = "Protocols that are excluded from Ingress VLAN filtering. These protocols are not dropped if they have an invalid VLAN. (arp, dhcpv4, dhcpv6, eapol, igmp, mld, nd, pppoe-discovery, ripv1)."
[[menus.arguments]]
name = "bypass-ingress-port-policing-for"
