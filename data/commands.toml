description = "Client certificate from the certificate store."
[[menus.arguments]]
name = "verify-server-certificate"
type = "bool"
description = "Checks the server certificate's CN or SAN against the connect-to parameter and enables trust-chain validation against the router's certificate store. The IP or hostname must be present in the server's certificate."
[[menus.arguments]]
name = "tls-version"
type = "enum (any | only-1.2) { any:0, only-1.2:2 }"
description = "Specifies which TLS versions to allow."
[[menus.arguments]]
name = "auth"
type = "enum (sha1 | md5 | sha256 | sha384 | sha512 | null) { sha1:1, md5:2, sha256:8, sha384:32, sha512:..."
description = "Allowed authentication methods."
[[menus.arguments]]
name = "cipher"
