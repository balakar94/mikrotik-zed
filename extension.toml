id = "mikrotik-rsc"
name = "MikroTik RouterOS Script"
description = "MikroTik RouterOS v7.20+ language support with highlighting, completions, hover docs, diagnostics and one-click deploy."
version = "0.5.0"
schema_version = 1
authors = ["balakar94"]
repository = "https://github.com/balakar94/mikrotik-zed"
languages = ["languages/rsc"]

# Grammar source — public repo for portable installs and publishing.
# rev MUST be a real commit SHA from https://github.com/balakar94/tree-sitter-rsc
# Update after pushing grammars/rsc: `git -C grammars/rsc rev-parse HEAD`
[grammars.rsc]
repository = "https://github.com/balakar94/tree-sitter-rsc"
rev = "2fdfe888ab37d15a2bc4265e0d4bb12193b56f5f"

[language_servers.rsc-ls]
name = "MikroTik Language Server"
languages = ["MikroTik Script"]
