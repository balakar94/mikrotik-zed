name = "MikroTik Script"
grammar = "rsc"
path_suffixes = ["rsc"]
line_comments = ["#"]
autoclose_before = ";:.,=}])>\"' \t\n"
# Word characters for double-click selection and word motions. `$` covers
# `$var` references; `:` keeps `:verb` script keywords whole; `/` keeps
# `/ip/address` menu paths whole. Brackets/autoclose above are unaffected.
word_characters = ["_", "-", "$", "@", ":", "/"]

# A physical line ending in the RouterOS line-continuation backslash indents
# the following line by one level (Zed language-extension docs:
# increase_indent_pattern). TOML literal string keeps the regex readable:
# `[\\]` is a single backslash, `\s*$` allows trailing spaces before EOL.
increase_indent_pattern = '[\\]\s*$'

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
    # Quote brackets handled via config with not_in guards so autoclosing
    # never fires inside strings or comments (see brackets.scm comment).
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
