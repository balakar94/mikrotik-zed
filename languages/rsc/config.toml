name = "MikroTik Script"
grammar = "rsc"
path_suffixes = ["rsc"]
line_comments = ["#"]
autoclose_before = ";:.,=}])>\"' \t\n"
# Word characters for double-click selection and word motions. `$` covers
# `$var` references; `:` keeps `:verb` script keywords whole; `/` keeps
# `/ip/address` menu paths whole. Brackets/autoclose above are unaffected.
word_characters = ["_", "-", "$", "@", ":", "/"]

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
    # `"` bracket handled via config with not_in string guard (see brackets.scm comment)
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
