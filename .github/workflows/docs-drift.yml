name: Upstream Watchdog

# Weekly watchdog for upstream RouterOS documentation drift.
#
# Compares manual.mikrotik.com against the recorded snapshot via
# scripts/sync_llms.py --check (exit 0 = ok, 2 = drift, 1 = fetch error):
#   - drift → open (or comment on) an `upstream-docs` labeled issue embedding
#     the detection date and the per-file remote hash/version hints printed by
#     --check, plus exact maintainer fix instructions. One comment per run
#     (weekly cadence caps noise; 24h dedup deliberately skipped).
#   - ok    → auto-close any open drift issue as completed ("Resolved").
#   - error → warn only AND streak-track via a dedicated `upstream-docs`
#     tracker issue ("Upstream docs check - transient errors"): first failure
#     is log-level noise, the comment escalates once the streak reaches 2
#     consecutive failures, and any later ok/drift run closes the tracker
#     (streak reset). Transient network failures must not paint the repo red,
#     so the error path never exits non-zero and never opens a PR.
# Scheduled workflows only run on the default branch.

on:
  schedule:
    - cron: "43 5 * * 1" # Mondays 05:43 UTC — offset from security-audit (06:17)
  workflow_dispatch:

# contents: read for checkout; issues: write so GITHUB_TOKEN can open/comment/close.
permissions:
  contents: read
  issues: write

concurrency:
  group: docs-drift
  cancel-in-progress: false

jobs:
  watchdog:
    name: Upstream docs • drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Map sync_llms.py exit codes to a step output consumed by the branches below.
      - name: Compare upstream docs against recorded snapshot
        id: check
        run: |
          set +e
          python3 scripts/sync_llms.py --check > "$RUNNER_TEMP/check.out" 2>&1
          ec=$?
          set -e
          cat "$RUNNER_TEMP/check.out"
          case $ec in
            0) result=ok ;;
            2) result=drift ;;
            *) result=error ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "result=$result"

      # ── drift: notify maintainer via one labeled issue ──────────────
      - name: Drift — open or update the upstream-docs issue
        if: steps.check.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Idempotent label bootstrap: gh issue create would fail on a missing label.
          gh label create upstream-docs --color D93F0B \
            --description "Upstream RouterOS docs drifted from the recorded snapshot" >/dev/null 2>&1 || true

          number=$(gh issue list --state open --label upstream-docs \
            --json number,title \
            --jq '.[] | select(.title | startswith("Upstream RouterOS docs drifted")) | .number' \
            | head -n1)

          {
            echo "Detection date (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo '```text'
            cat "$RUNNER_TEMP/check.out"
            echo '```'
            echo ""
            echo "### How to resolve"
            echo ""
            echo '```bash'
            echo "python3 scripts/sync_llms.py && python3 scripts/extract_commands.py"
            echo '```'
            echo ""
            echo "Review \`git diff data/\`, commit both regenerated files, and push — this watchdog"
            echo "closes the issue automatically once \`sync_llms.py --check\` reports no drift."
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$number" ]; then
            echo "Open issue #$number found — appending this run's report."
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            echo "No open issue — creating one."
            gh issue create \
              --title "Upstream RouterOS docs drifted from the recorded snapshot" \
              --label upstream-docs \
              --body-file "$RUNNER_TEMP/body.md"
          fi

      # ── ok: auto-resolve a stale issue ──────────────────────────────
      - name: No drift — close stale upstream-docs issue if open
        if: steps.check.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          number=$(gh issue list --state open --label upstream-docs \
            --json number,title \
            --jq '.[] | select(.title | startswith("Upstream RouterOS docs drifted")) | .number' \
            | head -n1)
          if [ -z "$number" ]; then
            echo "No open upstream-docs issue — nothing to close."
            exit 0
          fi
          echo "Closing #$number (snapshot re-synced)."
          gh issue comment "$number" --body "Resolved (snapshot re-synced)"
          gh issue close "$number" --reason completed

      # ── error: transient failure stays green, streak-tracked ────────
      - name: Fetch error — streak-track, warn only
        if: steps.check.outputs.result == 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Streak state lives on a dedicated tracker issue (no extra infra,
          # no cache permissions needed). Marker comments carry
          # `<!-- watchdog-error -->` so the streak is countable; the visible
          # escalation only appears at streak >= 2. Never exits non-zero.
          gh label create upstream-docs --color D93F0B \
            --description "Upstream RouterOS docs drifted from the recorded snapshot" >/dev/null 2>&1 || true

          tracker=$(gh issue list --state open --label upstream-docs \
            --json number,title \
            --jq '.[] | select(.title | startswith("Upstream docs check - transient errors")) | .number' \
            | head -n1)

          if [ -z "$tracker" ]; then
            echo "No tracker issue — creating one (streak 1)."
            tracker=$(gh issue create \
              --title "Upstream docs check - transient errors" \
              --label upstream-docs \
              --body "The weekly upstream-docs check failed to reach manual.mikrotik.com. This tracker counts CONSECUTIVE failures and auto-closes once a check succeeds or reports drift. The first failure is warn-only noise control — escalation starts at streak 2." \
              --json number --jq '.number')
            prior=0
          else
            prior=$(gh issue view "$tracker" --json comments \
              --jq '[.comments[] | select(.body | contains("<!-- watchdog-error -->"))] | length')
          fi
          streak=$((prior + 1))
          echo "Consecutive-error streak: $streak (tracker #$tracker)"

          {
            echo "<!-- watchdog-error -->"
            echo "Transient check failure (streak $streak) at $(date -u '+%Y-%m-%dT%H:%M:%SZ')."
            echo ""
            echo '```text'
            cat "$RUNNER_TEMP/check.out"
            echo '```'
            if [ "$streak" -ge 2 ]; then
              echo ""
              echo "**Second consecutive failure** — upstream may be down or the network path broken. No action yet; this tracker auto-closes on recovery. Escalate manually only if the streak keeps growing."
            else
              echo ""
              echo "First failure in a row — warn only, will retry on the next weekly run."
            fi
          } > "$RUNNER_TEMP/error.md"
          gh issue comment "$tracker" --body-file "$RUNNER_TEMP/error.md"
          echo "::warning::sync_llms.py --check failed (streak $streak, network/upstream error) — will retry next scheduled run"

      # ── streak reset: any successful contact (ok or drift) clears the count
      - name: Error streak reset — close transient-errors tracker on ok/drift
        if: steps.check.outputs.result != 'error'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tracker=$(gh issue list --state open --label upstream-docs \
            --json number,title \
            --jq '.[] | select(.title | startswith("Upstream docs check - transient errors")) | .number' \
            | head -n1)
          if [ -z "$tracker" ]; then
            echo "No transient-errors tracker open — streak already at zero."
            exit 0
          fi
          echo "Check recovered (result: ${{ steps.check.outputs.result }}) — closing tracker #$tracker."
          gh issue comment "$tracker" --body "Recovered (check ${{ steps.check.outputs.result }}) — streak reset."
          gh issue close "$tracker" --reason completed
