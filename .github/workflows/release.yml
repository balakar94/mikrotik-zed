            sha256sum "rsc-ls-aarch64-unknown-linux-gnu" >> SHA256SUMS
          else
            shasum -a 256 "rsc-ls-aarch64-unknown-linux-gnu" > "rsc-ls-aarch64-unknown-linux-gnu.sha256"
            shasum -a 256 "rsc-ls-aarch64-unknown-linux-gnu" >> SHA256SUMS
          fi
