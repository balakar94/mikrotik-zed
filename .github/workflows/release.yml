name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.0) — leave empty to use version from Cargo.toml"
        required: false
        type: string

# Default minimal permissions; release job escalates to write + id-token for attestations.
permissions:
  contents: read

concurrency:
  # Keyed by tag identity: a tag push and a workflow_dispatch for the same tag
  # must serialize on the same group instead of racing on the same release.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Meta: resolve and validate tag once, share via outputs ─────────
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the workflow_dispatch guard below must
          # resolve the input tag via `git tag -l` / `git rev-parse`.
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          set -eu
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep '^version' Cargo.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
            TAG="v${VER}"
            echo "::notice::No tag ref — derived TAG=$TAG from Cargo.toml"
          fi
          # Validate semver tag vMAJOR.MINOR.PATCH (allow prerelease/build suffix but warn)
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"
          cat "$GITHUB_OUTPUT"

      - name: Validate Cargo.toml version matches tag
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          CARGO_VER=$(grep '^version' Cargo.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
          LSP_VER=$(grep '^version' lsp/Cargo.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
          EXT_VER=$(grep '^version' extension.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "tag version=$VERSION cargo=$CARGO_VER lsp=$LSP_VER extension=$EXT_VER"
          # Enforce every release manifest matches the tag — Zed publishes
          # extension.toml's version, so a stale one ships the wrong version.
          if [ "$CARGO_VER" != "$VERSION" ]; then
            echo "::error::Cargo.toml version $CARGO_VER != tag $TAG — bump via 'make bump VERSION=$VERSION'"
            exit 1
          fi
          if [ "$LSP_VER" != "$VERSION" ]; then
            echo "::error::lsp/Cargo.toml version $LSP_VER != $VERSION — bump via 'make bump VERSION=$VERSION'"
            exit 1
          fi
          if [ "$EXT_VER" != "$VERSION" ]; then
            echo "::error::extension.toml version $EXT_VER != tag $TAG — bump via 'make bump VERSION=$VERSION'"
            exit 1
          fi

      - name: Require annotated tag (fail on lightweight)
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          # Annotated tags carry their own tag object; lightweight tags point
          # directly at a commit. `git cat-file -t` reports `tag` vs `commit`,
          # so anything but `tag` fails closed here. Signature enforcement
          # itself lives in repository push rules (no keyring runs in this job);
          # this gate only guarantees the tag shape that signatures require.
          TYPE=$(git cat-file -t "$TAG" 2>/dev/null || echo "missing")
          echo "Tag $TAG object type: $TYPE"
          if [ "$TYPE" != "tag" ]; then
            echo "::error::Tag '$TAG' is lightweight (type $TYPE) — recreate as annotated (git tag -a $TAG -m 'release $TAG' && git push origin $TAG); signatures are enforced by repository push rules"
            exit 1
          fi
          echo "Annotated tag OK: $TAG"

      - name: Guard — workflow_dispatch tag must exist at this SHA
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Dispatch guard: TAG=$TAG SHA=${{ github.sha }}"
          if [ -z "$TAG" ]; then
            echo "::error::Empty tag for workflow_dispatch — pass a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if ! git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "::error::Dispatch tag '$TAG' does not exist — push it first (git tag -a $TAG -m 'release $TAG' && git push origin $TAG)"
            exit 1
          fi
          TAG_SHA=$(git rev-parse "$TAG^{commit}")
          echo "tag $TAG -> $TAG_SHA; github.sha=${{ github.sha }}"
          if [ "$TAG_SHA" != "${{ github.sha }}" ]; then
            echo "::error::Dispatch tag '$TAG' points at $TAG_SHA, not github.sha ${{ github.sha }} — refusing untested dispatch"
            exit 1
          fi
          echo "Dispatch guard OK: $TAG == ${{ github.sha }}"

      - name: Guard — tag commit is on main
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"
          # Releases ship from main only: a correctly-versioned tag on an
          # unreleased feature branch must not publish public binaries.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" FETCH_HEAD; then
            echo "::error::Tag '$TAG' is not an ancestor of origin/main — publish releases from main"
            exit 1
          fi
          echo "Ancestry OK: $TAG is on main"

  # ── Preflight: test + lint + manifest + grammar on the release SHA ──
  preflight:
    name: Preflight checks
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve Rust toolchain
        id: toolchain
        run: |
          CH=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || grep -E 'channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CH" ]; then echo "::error::failed to resolve toolchain"; exit 1; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved toolchain: $CH"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }} (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 6c977a6
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Main-only saves: caches written on a tag ref are not restorable by
          # main (cache scope), so tag builds only restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests (cargo test --workspace --locked)
        run: cargo test --workspace --locked

      - name: Clippy (rsc-ls --all-targets -D warnings)
        run: cargo clippy -p rsc-ls --all-targets -- -D warnings

      - name: Manifest check (make check-manifest)
        run: make check-manifest

      # grammars/rsc is an untracked working copy, so clone it at the pinned
      # rev — same recipe as ci.yml's grammar job.
      # Single source of truth: scripts/clone_grammar.py (also used by `make grammar-clone`).
      - name: Clone grammar at pinned rev
        run: python3 scripts/clone_grammar.py

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grammars/rsc/package.json

      - name: Install tree-sitter-cli
        working-directory: grammars/rsc
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npx tree-sitter --version

      - name: Check parser is up-to-date (make generate-check)
        run: make generate-check

  # ── Build WASM extension (single artifact, any runner) ─────────────
  wasm:
    name: Build WASM
    needs: [meta, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MSRV — toolchain channel from rust-toolchain.toml (single source of truth). Keep in sync with
      # Cargo.toml rust-version.
      - name: Resolve Rust toolchain
        id: toolchain
        run: |
          CH=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || grep -E 'channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CH" ]; then echo "::error::failed to resolve toolchain"; exit 1; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved toolchain: $CH"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }} (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 6c977a6
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-wasip2

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          # Main-only saves: caches written on a tag ref are not restorable by
          # main (cache scope), so tag builds only restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build WASM
        run: cargo build --locked --target wasm32-wasip2 --release

      - name: Prepare artifact (extension.wasm + checksums)
        run: |
          set -eu
          SRC="target/wasm32-wasip2/release/mikrotik_zed.wasm"
          if [ ! -f "$SRC" ]; then
            echo "::error::WASM not found at $SRC"
            ls -R target/wasm32-wasip2/release || true
            exit 1
          fi
          ls -lh "$SRC"
          file "$SRC" || true
          # Prefer wasm-tools component encoding if available; fallback to raw module.
          # Zed's extension_builder does component encoding on 'Install Dev Extension',
          # but for the release artifact we ship the raw wasm (Zed handles it).
          # Keep naming stable: extension.wasm
          if command -v wasm-tools >/dev/null 2>&1; then
            echo "wasm-tools found — verifying module"
            wasm-tools validate "$SRC" 2>&1 || echo "::warning::wasm-tools validate failed"
          fi
          cp "$SRC" extension.wasm
          ls -lh extension.wasm
          sha256sum extension.wasm > extension.wasm.sha256 2>/dev/null || shasum -a 256 extension.wasm > extension.wasm.sha256
          cat extension.wasm.sha256
          # Combined manifest
          sha256sum extension.wasm > SHA256SUMS 2>/dev/null || shasum -a 256 extension.wasm > SHA256SUMS

      - name: Attest WASM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: hashFiles('extension.wasm') != ''
        with:
          subject-path: extension.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm
          path: |
            extension.wasm
            extension.wasm.sha256
          if-no-files-found: error
          retention-days: 14

  # ── Build rsc-ls per target (explicit jobs, no matrix) ──────────
  build-linux-x86:
    name: Build Linux x86
    needs: [meta, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RSC_LS_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CH=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || grep -E 'channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CH" ]; then echo "::error::failed to resolve toolchain"; exit 1; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved toolchain: $CH"
      - name: Install Rust ${{ steps.toolchain.outputs.channel }} (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 6c977a6
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-gnu
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock') }}
          # Main-only saves: caches written on a tag ref are not restorable by
          # main (cache scope), so tag builds only restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build rsc-ls
        run: cargo build -p rsc-ls --locked --release --target x86_64-unknown-linux-gnu
      - name: Prepare binary + checksums
        shell: bash
        run: |
          set -eu
          SRC="target/x86_64-unknown-linux-gnu/release/rsc-ls"
          if [ ! -f "$SRC" ]; then
            echo "::error::Binary not found at $SRC"
            ls -lh "target/x86_64-unknown-linux-gnu/release/" || true
            exit 1
          fi
          ls -lh "$SRC"; file "$SRC" || true
          if command -v strip >/dev/null 2>&1; then strip "$SRC" 2>/dev/null || echo "::notice::strip failed (ignored)"; fi
          cp "$SRC" rsc-ls-x86_64-unknown-linux-gnu; chmod +x rsc-ls-x86_64-unknown-linux-gnu; ls -lh rsc-ls-x86_64-unknown-linux-gnu
          # Checksums: both per-file and for combined manifest.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "rsc-ls-x86_64-unknown-linux-gnu" > "rsc-ls-x86_64-unknown-linux-gnu.sha256"
            sha256sum "rsc-ls-x86_64-unknown-linux-gnu" >> SHA256SUMS
          else
            shasum -a 256 "rsc-ls-x86_64-unknown-linux-gnu" > "rsc-ls-x86_64-unknown-linux-gnu.sha256"
            shasum -a 256 "rsc-ls-x86_64-unknown-linux-gnu" >> SHA256SUMS
          fi
          cat "rsc-ls-x86_64-unknown-linux-gnu.sha256"
          cat SHA256SUMS
      - name: Smoke — run --version
        shell: bash
        run: |
          set -eu
          ./rsc-ls-x86_64-unknown-linux-gnu --version
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rsc-ls-x86_64-unknown-linux-gnu
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsc-ls-x86_64-unknown-linux-gnu
          path: |
            rsc-ls-x86_64-unknown-linux-gnu
            rsc-ls-x86_64-unknown-linux-gnu.sha256
          if-no-files-found: error
          retention-days: 14

  build-linux-arm64:
    name: Build Linux arm64
    needs: [meta, preflight]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
