    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CH=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || grep -E 'channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CH" ]; then echo "::error::failed to resolve toolchain"; exit 1; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved toolchain: $CH"
      - name: Install Rust ${{ steps.toolchain.outputs.channel }} (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 6c977a6
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-apple-darwin
      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-apple-darwin-${{ hashFiles('Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      - name: Build rsc-ls
        run: cargo build -p rsc-ls --locked --release --target x86_64-apple-darwin
      - name: Prepare binary + checksums
        shell: bash
        run: |
          set -eu
          SRC="target/x86_64-apple-darwin/release/rsc-ls"
          if [ ! -f "$SRC" ]; then
            echo "::error::Binary not found at $SRC"
            ls -lh "target/x86_64-apple-darwin/release/" || true
            exit 1
          fi
          ls -lh "$SRC"; file "$SRC" || true
          if command -v strip >/dev/null 2>&1; then strip "$SRC" 2>/dev/null || echo "::notice::strip failed (ignored)"; fi
          cp "$SRC" rsc-ls-x86_64-apple-darwin; chmod +x rsc-ls-x86_64-apple-darwin; ls -lh rsc-ls-x86_64-apple-darwin
          # Checksums: both per-file and for combined manifest.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "rsc-ls-x86_64-apple-darwin" > "rsc-ls-x86_64-apple-darwin.sha256"
            sha256sum "rsc-ls-x86_64-apple-darwin" >> SHA256SUMS
          else
            shasum -a 256 "rsc-ls-x86_64-apple-darwin" > "rsc-ls-x86_64-apple-darwin.sha256"
            shasum -a 256 "rsc-ls-x86_64-apple-darwin" >> SHA256SUMS
          fi
          cat "rsc-ls-x86_64-apple-darwin.sha256"
          cat SHA256SUMS
      - name: Smoke — run --version via Rosetta (guarded)
        shell: bash
        run: |
          set -eu
          BIN="rsc-ls-x86_64-apple-darwin"
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta available — smoke-running $BIN via arch -x86_64"
            /usr/bin/arch -x86_64 "./$BIN" --version
          else
            echo "::warning::Rosetta unavailable — skipping native smoke for $BIN (runner changed)"
          fi
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rsc-ls-x86_64-apple-darwin
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsc-ls-x86_64-apple-darwin
          path: |
            rsc-ls-x86_64-apple-darwin
            rsc-ls-x86_64-apple-darwin.sha256
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

