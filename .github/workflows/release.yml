  # ── Validations: extension.toml + publish checks ─────────────────
  validations:
    name: Validations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [meta, wasm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate extension.toml
        run: |
          set -eu
          echo "Checking extension.toml..."
          cat extension.toml
          python3 scripts/check_zed_requirements.py
          grep -q '^id = "mikrotik-rsc"' extension.toml || { echo "::error::id must be mikrotik-rsc"; exit 1; }
          if grep -q 'rev = "000' extension.toml; then echo "::error::rev placeholder 000... found — run scripts/publish_grammar.py --push"; exit 1; fi
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          EXT_VER=$(grep '^version' extension.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "extension.toml version=$EXT_VER tag=$TAG"
          if [ -n "$VERSION" ] && [ "$EXT_VER" != "$VERSION" ]; then echo "::error::extension.toml version $EXT_VER != tag $TAG — bump via 'make bump VERSION=$VERSION'"; exit 1; fi
          echo "extension.toml OK"
      - name: WASM artifact info
        run: |
          echo "WASM artifact from build job will be included in the Release."
          echo "Publish checklist:"
          echo "  1. Ensure grammar rev is pushed: python scripts/publish_grammar.py --push"
          echo "  2. Bump version: make bump VERSION=${{ needs.meta.outputs.version }} && cargo check && git diff"
          echo "  3. Tag (annotated; lightweight is rejected by the meta job): git tag -a ${{ needs.meta.outputs.tag }} -m 'release ${{ needs.meta.outputs.tag }}' && git push origin ${{ needs.meta.outputs.tag }}"
          echo "  4. Wait for Release workflow to publish assets, then distribute per README 'Release' section"

  # ── Create GitHub Release with all binaries ────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [meta, wasm, build-linux-x86, build-linux-arm64, build-macos-arm64, build-macos-x86, build-windows-x86, build-windows-arm64, validations]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Manual-approval gate: configure required reviewers on the `release`
    # environment in repository settings to pause here before a draft exists.
    environment: release
    permissions:
      # Attestations are produced in the build jobs; this job only creates and
      # updates the draft release, so contents: write is the whole surface.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need tags for generate_release_notes and to verify tag existence.
          fetch-depth: 0

      - name: Guard — tag must not already have a release (idempotency)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ needs.meta.outputs.tag }}"
          echo "Checking if release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists — softprops/action-gh-release will update it (idempotent, draft stays draft until the publish job). Continuing."
            gh release view "$TAG" --json tagName,isDraft,createdAt,url --jq '{tag:.tagName, isDraft, url:.url, createdAt}'
          else
            echo "No existing release for $TAG — will create new draft."
          fi
          # Rollback / withdrawal (see the publish job for the same note):
          #   gh release edit "$TAG" --draft=true   # withdraw from users
          #   gh release delete "$TAG" --yes        # remove entirely
          # Draft releases are invisible to the WASM shim, so nothing is
          # downloaded until the publish job flips the draft after postflight.

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Install SBOM tool (pinned)
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-cyclonedx@0.5.9

      # MSRV — toolchain channel from rust-toolchain.toml (single source of
      # truth); cargo-cyclonedx shells out to `cargo metadata`.
      - name: Resolve Rust toolchain
        id: toolchain
        run: |
          CH=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || grep -E 'channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CH" ]; then echo "::error::failed to resolve toolchain"; exit 1; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved toolchain: $CH"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }} (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 6c977a6
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Generate CycloneDX SBOMs (cargo metadata)
        run: |
          set -eu
          # One CycloneDX JSON SBOM per workspace member (root WASM crate and
          # rsc-ls) from cargo metadata at this exact SHA. Default output names
          # are `<package>.cdx.json` next to each member's Cargo.toml.
          cargo cyclonedx --manifest-path Cargo.toml --format json
          for f in mikrotik-zed.cdx.json lsp/rsc-ls.cdx.json; do
            if [ ! -f "$f" ]; then
              echo "::error::expected SBOM $f not produced by cargo cyclonedx"
              ls -l . lsp || true
              exit 1
            fi
          done
          cp mikrotik-zed.cdx.json dist/sbom-mikrotik-zed.cdx.json
          cp lsp/rsc-ls.cdx.json dist/sbom-rsc-ls.cdx.json
          # Per-file companions so the combined SHA256SUMS and postflight cover
          # the SBOMs like every other release asset.
          (cd dist && sha256sum sbom-mikrotik-zed.cdx.json > sbom-mikrotik-zed.cdx.json.sha256)
          (cd dist && sha256sum sbom-rsc-ls.cdx.json > sbom-rsc-ls.cdx.json.sha256)
          cat dist/sbom-mikrotik-zed.cdx.json.sha256 dist/sbom-rsc-ls.cdx.json.sha256
          # NOTE: never list dist/ from inside a file being written into dist/.

      - name: Build combined SHA256SUMS
        run: |
          set -eu
          echo "Artifacts in dist/:"
          ls -R dist
          # Build the single combined SHA256SUMS once here from per-file
          # companions (per-job uploads carry only binary + binary.sha256).
          echo "# SHA256 checksums for ${{ needs.meta.outputs.tag }}" > SHA256SUMS
          echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> SHA256SUMS
          if ls dist/*.sha256 >/dev/null 2>&1; then
            cat dist/*.sha256 >> SHA256SUMS
          fi
          # Ensure every artifact has an entry even if its per-file sha missing.
          for f in dist/rsc-ls-* dist/extension.wasm dist/sbom-*.cdx.json; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if ! grep -q "$base" SHA256SUMS 2>/dev/null; then
              if command -v sha256sum >/dev/null 2>&1; then
                (cd dist && sha256sum "$base") >> SHA256SUMS
              else
                (cd dist && shasum -a 256 "$base") >> SHA256SUMS
              fi
            fi
          done
          sort -u SHA256SUMS -o SHA256SUMS || true
          cat SHA256SUMS
          # Also produce sorted checksums file in dist for upload.
          cp SHA256SUMS dist/SHA256SUMS
          echo "Final dist contents:"
          ls -lh dist/
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/* 2>/dev/null | head -n 20
          else
            shasum -a 256 dist/* | head -n 20
          fi

      - name: Generate release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## MikroTik RSC ${{ needs.meta.outputs.tag }}

          ### Binaries
          - `rsc-ls-aarch64-apple-darwin` – macOS Apple Silicon
          - `rsc-ls-x86_64-apple-darwin` – macOS Intel
          - `rsc-ls-aarch64-unknown-linux-gnu` – Linux ARM64
          - `rsc-ls-x86_64-unknown-linux-gnu` – Linux x64
          - `rsc-ls-x86_64-pc-windows-msvc` – Windows x64
          - `rsc-ls-aarch64-pc-windows-msvc` – Windows ARM64

          SHA256 checksums in `SHA256SUMS` and per-file `*.sha256`. Attestations are attached as build provenance.

          ### SBOM
          - `sbom-mikrotik-zed.cdx.json`, `sbom-rsc-ls.cdx.json` – CycloneDX JSON SBOMs generated from cargo metadata (one per workspace member), each with a `.sha256` companion covered by `SHA256SUMS` and the postflight checksum loop.

          ### WASM
          - `extension.wasm` – Zed extension (wasm32-wasip2, `mikrotik_zed.wasm`)

          The Zed extension auto-downloads the correct binary on first use via `zed::download_file`.
          Manual install:
          ```bash
          cargo build -p rsc-ls --release
          # or download the matching binary and put it in PATH as `rsc-ls`
          # verify: sha256sum -c SHA256SUMS
          ```

          ### Observability
          Set `RSC_LS_LOG=debug` and run `zed --foreground` for verbose LSP logs.
          EOF
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release-notes.md
          # Draft until the postflight+publish jobs verify every asset; a
          # version with a hyphen (0.7.0-rc.1) is flagged as prerelease so the
          # shim's pre_release: false lookup can never auto-select it.
          draft: true
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Postflight: prove the download contract from the draft release ──
  # The release is still a draft here; the publish job flips it only after
  # every check below passes. Rollback: gh release delete TAG --yes.
  postflight:
    name: Postflight verify
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download draft assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ needs.meta.outputs.tag }}"
          echo "Downloading every asset + .sha256 companion from draft $TAG..."
          mkdir -p verify
          gh release download "$TAG" --repo "${{ github.repository }}" --dir verify
          echo "Downloaded:"
          ls -lh verify/

      - name: Verify checksums (sha256sum -c each companion)
        run: |
          set -eu
          cd verify
          ls -lh
          # Every published binary must have a same-named .sha256 companion —
          # this is the exact contract the WASM shim relies on (fetch <asset>.sha256).
          for asset in rsc-ls-x86_64-unknown-linux-gnu rsc-ls-aarch64-unknown-linux-gnu rsc-ls-aarch64-apple-darwin rsc-ls-x86_64-apple-darwin rsc-ls-x86_64-pc-windows-msvc rsc-ls-aarch64-pc-windows-msvc extension.wasm; do
            test -f "$asset" || { echo "::error::Missing published asset $asset"; exit 1; }
            test -f "$asset.sha256" || { echo "::error::Missing companion $asset.sha256 for $asset"; exit 1; }
          done
          for sum in *.sha256; do
            echo "--- $sum ---"
            cat "$sum"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c "$sum"
            else
              shasum -a 256 -c "$sum"
            fi
          done
          if [ -f SHA256SUMS ]; then
            echo "--- SHA256SUMS ---"
            cat SHA256SUMS
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c SHA256SUMS
            else
              shasum -a 256 -c SHA256SUMS
            fi
          else
            echo "::error::Missing combined SHA256SUMS in release"
            exit 1
          fi
          echo "Postflight OK: every companion verified."

      # Verify the published bytes actually run — checksums alone do not prove
      # the Linux x64 artifact is executable on a glibc host.
      - name: Smoke — execute the published Linux x86_64 binary
        run: |
          set -eu
          cd verify
          VERSION="${{ needs.meta.outputs.version }}"
          BIN="rsc-ls-x86_64-unknown-linux-gnu"
          chmod +x "$BIN"
          OUT=$(./"$BIN" --version)
          echo "$OUT"
          case "$OUT" in
            *"$VERSION"*) echo "Published $BIN reports expected version $VERSION" ;;
            *)
              echo "::error::published $BIN version mismatch: '$OUT' does not contain '$VERSION'"
              exit 1
              ;;
          esac

      - name: Install wasm-tools (pinned)
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: wasm-tools@1.259.0

      - name: Validate the published WASM component
        run: |
          set -eu
          cd verify
          file extension.wasm
          wasm-tools validate --features all extension.wasm
          echo "extension.wasm is a valid WebAssembly component"

  # ── Publish: flip the verified draft to public (environment-gated) ──
  # Kept separate from the release job so a postflight failure leaves the
  # release as a draft: the shim's `latest_github_release` lookup ignores
  # drafts, so no user can download an unverified build.
  publish:
    name: Publish release
    needs: [meta, release, postflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Manual-approval gate: configure required reviewers on the `release`
    # environment in repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ needs.meta.outputs.tag }}"
          gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json tagName,isDraft,isPrerelease,url --jq '{tag:.tagName, isDraft, isPrerelease, url}'
          echo "Published $TAG (draft=false)."
          # Rollback / withdrawal:
          #   gh release edit "$TAG" --draft=true   # withdraw from users
          #   gh release delete "$TAG" --yes        # remove the release entirely
          # While the release is a draft it is invisible to installs; nothing
          # is served until this job succeeds.

