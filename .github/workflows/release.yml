          cp "$SRC" rsc-ls-aarch64-pc-windows-msvc; chmod +x rsc-ls-aarch64-pc-windows-msvc 2>/dev/null || true; ls -lh rsc-ls-aarch64-pc-windows-msvc
          # Checksums: both per-file and for combined manifest.
