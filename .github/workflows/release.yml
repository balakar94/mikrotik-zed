          subject-path: rsc-ls-aarch64-pc-windows-msvc
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsc-ls-aarch64-pc-windows-msvc
          path: rsc-ls-aarch64-pc-windows-msvc
          if-no-files-found: error
          retention-days: 14

  # ── Validations: extension.toml + publish checks ─────────────────
  validations:
    name: Validations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [meta, wasm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate extension.toml
        run: |
          set -eu
          echo "Checking extension.toml..."
          cat extension.toml
          python3 scripts/check_zed_requirements.py
          grep -q '^id = "mikrotik-rsc"' extension.toml || { echo "::error::id must be mikrotik-rsc"; exit 1; }
          if grep -q 'rev = "000' extension.toml; then echo "::error::rev placeholder 000... found — run scripts/publish_grammar.py --push"; exit 1; fi
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          EXT_VER=$(grep '^version' extension.toml | head -n1 | sed -E 's/.*"(.*)"/\1/')
          echo "extension.toml version=$EXT_VER tag=$TAG"
          if [ -n "$VERSION" ] && [ "$EXT_VER" != "$VERSION" ]; then echo "::warning::extension.toml version $EXT_VER != tag $TAG"; fi
          echo "extension.toml OK"
      - name: WASM artifact info
        run: |
          echo "WASM artifact from build job will be included in the Release."
          echo "Publish checklist:"
          echo "  1. Ensure grammar rev is pushed: python scripts/publish_grammar.py --push"
          echo "  2. Bump version: make bump VERSION=${{ needs.meta.outputs.version }} && cargo check && git diff"
          echo "  3. Tag: git tag ${{ needs.meta.outputs.tag }} && git push origin --tags"
          echo "  4. Wait for Release workflow to publish assets, then distribute per README 'Release' section"

  # ── Create GitHub Release with all binaries ────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [meta, wasm, build-linux-x86, build-linux-arm64, build-macos-arm64, build-macos-x86, build-windows-x86, build-windows-arm64, validations]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need tags for generate_release_notes and to verify tag existence.
          fetch-depth: 0

      - name: Guard — tag must not already have a release (idempotency)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${{ needs.meta.outputs.tag }}"
          echo "Checking if release $TAG already exists..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists — softprops/action-gh-release will update it (idempotent). Continuing."
            gh release view "$TAG" --json tagName,createdAt,url --jq '{tag:.tagName, url:.url, createdAt}'
          else
            echo "No existing release for $TAG — will create new."
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts (digests now provided by GitHub)
        run: |
          set -eu
          echo "Artifacts in dist/ (SHA256 now exposed natively by GitHub Releases):"
          ls -R dist
          ls -lh dist/
          echo "No manual SHA256SUMS generation — GitHub auto-computes digests per asset."

      - name: Generate release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## MikroTik RSC ${{ needs.meta.outputs.tag }}

          ### Binaries
          - `rsc-ls-aarch64-apple-darwin` – macOS Apple Silicon
          - `rsc-ls-x86_64-apple-darwin` – macOS Intel
          - `rsc-ls-aarch64-unknown-linux-gnu` – Linux ARM64
          - `rsc-ls-x86_64-unknown-linux-gnu` – Linux x64
          - `rsc-ls-x86_64-pc-windows-msvc` – Windows x64
          - `rsc-ls-aarch64-pc-windows-msvc` – Windows ARM64
          SHA256 digests are shown automatically by GitHub next to each asset (REST/GraphQL/`gh release view` `digest` field). Attestations are attached as build provenance.

          ### WASM
          - `extension.wasm` – Zed extension (wasm32-wasip2, `mikrotik_zed.wasm`)


          The Zed extension auto-downloads the correct binary on first use via `zed::download_file`.
          Manual install:
          ```bash
          cargo build -p rsc-ls --release
          # or download the matching binary and put it in PATH as `rsc-ls`
          # verify: gh release view ${{ needs.meta.outputs.tag }} --json assets --jq '.assets[] | "\(.name) \(.digest)"'
          ```

          ### Observability
          Set `RSC_LS_LOG=debug` and run `zed --foreground` for verbose LSP logs.
          EOF
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

