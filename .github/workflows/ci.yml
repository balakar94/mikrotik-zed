name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal default permissions — jobs escalate only if needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref (PR updates, force-pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust: mirrors `make fmt && make clippy && make test-rust && make build*` ──
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MSRV — toolchain channel from rust-toolchain.toml (single source of truth). Keep in sync with
      # Cargo.toml rust-version and release.yml.
      - name: Resolve Rust toolchain
        id: toolchain
        run: |
          CH=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || grep -E 'channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CH" ]; then echo "::error::failed to resolve toolchain"; exit 1; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved toolchain: $CH"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }} (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 6c977a6
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only save on main to avoid PR cache poisoning.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check (make fmt)
        run: make fmt

      - name: Clippy (wasm + lsp, -D warnings)
        run: make clippy

      - name: Unit tests (make test-rust, all workspace members)
        run: make test-rust

      - name: Install cargo-audit
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-audit@0.22.2

      - name: Cargo audit (RustSec — PR gate)
        run: |
          cargo audit --version
          cargo audit

      - name: Build WASM (wasm32-wasip2)
        run: cargo build --locked --target wasm32-wasip2 --release

      - name: Build LSP (rsc-ls)
        run: cargo build -p rsc-ls --locked --release

      - name: Smoke — artifact sizes
        run: |
          echo "WASM:"
          ls -lh target/wasm32-wasip2/release/mikrotik_zed.wasm 2>/dev/null || echo "wasm missing"
          echo "LSP:"
          ls -lh target/release/rsc-ls 2>/dev/null || echo "rsc-ls missing"

      - name: Upload CI binaries (PR preview, 7 days)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-binaries-${{ github.sha }}
          path: |
            target/wasm32-wasip2/release/mikrotik_zed.wasm
            target/release/rsc-ls
          if-no-files-found: warn
          retention-days: 7

  # ── Windows: rsc-ls must compile and pass tests on MSVC ────────────
  # fmt/clippy/wasm are platform-independent (covered by the ubuntu job);
  # this job only guards Windows-specific compilation of the LSP binary.
  windows:
    name: Windows (rsc-ls compile + test)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MSRV — toolchain channel from rust-toolchain.toml (single source of truth).
      # Bash syntax → explicit `shell: bash` (Git Bash on the Windows runner).
      - name: Resolve Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CH=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])' 2>/dev/null || grep -E 'channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$CH" ]; then echo "::error::failed to resolve toolchain"; exit 1; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved toolchain: $CH"

      - name: Install Rust ${{ steps.toolchain.outputs.channel }} (MSRV)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 6c977a6
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests (cargo test -p rsc-ls)
        run: cargo test -p rsc-ls --locked

      - name: Build LSP (rsc-ls.exe)
        run: cargo build -p rsc-ls --locked --release

      # Cross-compile smoke: the release workflow ships aarch64-pc-windows-msvc
      # built exactly this way on the same runner image — catch toolchain or
      # link breakage here before a tag, not during a release.
      - name: Smoke — cross aarch64-pc-windows-msvc
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check -p rsc-ls --locked --target aarch64-pc-windows-msvc

      - name: Smoke — artifact size
        shell: bash
        run: ls -lh target/release/rsc-ls.exe || ls -lh target/release/rsc-ls

  # ── Python: mirrors `make test-python && make sync-check && make extract` ──
  python:
    name: Python extraction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # grammars/rsc is an untracked working copy (nested gitlinks break the
      # zed-industries/extensions packaging), so clone it at the pinned rev.
      - name: Clone grammar at pinned rev
        run: |
          set -eu
          REV=$(awk '/^\[grammars\.rsc\]/{f=1;next} f&&/^rev/{gsub(/"/,"",$3);print $3;exit}' extension.toml)
          if [ -z "$REV" ]; then
            echo "::error::[grammars.rsc].rev missing in extension.toml"
            exit 1
          fi
          case "$REV" in *0000*)
            echo "::error::placeholder rev found ($REV) — run scripts/publish_grammar.py"; exit 1;;
          esac
          echo "$REV" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::REV must be 40-char hex ($REV)"; exit 1; }
          git clone --quiet https://github.com/balakar94/tree-sitter-rsc grammars/rsc
          if [ "$(git -C grammars/rsc rev-parse HEAD)" != "$REV" ]; then
            git -C grammars/rsc fetch --quiet --depth 1 origin "$REV"
            git -C grammars/rsc checkout --quiet --detach FETCH_HEAD
          fi
          echo "grammar pinned at $(git -C grammars/rsc rev-parse HEAD)"

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # No pip cache: repo has no requirements.txt/pyproject.toml, so the default
          # cache-dependency-path (**/requirements.txt) would fail with "No file matched".
          # pip install is just pytest+tomli (tiny), so caching is not worth the complexity.

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest tomli
          pip freeze | grep -E "pytest|tomli" || true

      - name: Manifest schema check (make check-manifest)
        run: make check-manifest

      # llms.txt / llms-full.txt are gitignored and fetched from manual.mikrotik.com.
      # Fetch BEFORE tests so the staleness test (test_docs_staleness.py) can
      # recompute hashes against local bytes instead of skipping on clean checkout.
      - name: Fetch upstream docs (make sync)
        run: |
          set +e
          if [ -f llms.txt ] && [ -f llms-full.txt ]; then
            echo "llms files already present — checking if stale (make sync-check)"
            make sync-check
            ec=$?
            if [ $ec -eq 0 ]; then
              echo "Upstream docs unchanged."
            elif [ $ec -eq 2 ]; then
              echo "::notice::Upstream docs changed — fetching fresh via make sync"
              make sync || echo "::warning::make sync failed, using existing files"
            elif [ $ec -eq 1 ]; then
              echo "::warning::sync-check network failed, using existing files"
            fi
          else
            echo "llms files missing (gitignored on clean checkout) — fetching via make sync"
            make sync
            ec=$?
            if [ $ec -ne 0 ]; then
              echo "::warning::make sync failed (exit $ec) — Verify step will check local determinism only"
              # Don't fail; Verify step will still check data/commands.toml exists
            else
              echo "Fetched llms.txt/llms-full.txt"
              ls -lh llms*.txt
            fi
          fi
          exit 0

      - name: Run Python tests (make test-python)
        run: make test-python

      - name: Verify commands.toml is up-to-date (deterministic)
        run: |
          # Regenerate from current llms-full.txt (either cached from previous step or stale local).
          # If sync-check above fetched fresh docs, they are on disk (unless --check); if it
          # warned on network failure, this checks local determinism only.
          # Ignore the non-deterministic '# Generated:' timestamp so only real content drift fails.
          if [ ! -f llms-full.txt ]; then
            echo "::notice::llms-full.txt unavailable (upstream unreachable this run) — drift check skipped, verifying committed data/commands.toml structure only"
            test -s data/commands.toml || { echo "::error::data/commands.toml empty"; exit 1; }
            grep -q '^\[\[menus\]\]' data/commands.toml || { echo "::error::data/commands.toml missing [[menus]]"; exit 1; }
            echo "commands.toml structure OK (no upstream docs to diff against)"
            exit 0
          fi
          python scripts/extract_commands.py
          echo "Checking data/commands.toml drift (timestamp-agnostic)..."
          if [ -f data/commands.toml ]; then
            # Compare against HEAD, but handle history rewrite / shallow clones where HEAD file may be missing.
            if git cat-file -e HEAD:data/commands.toml 2>/dev/null; then
              diff -u <(git show HEAD:data/commands.toml | grep -v '^# Generated:') \
                    <(grep -v '^# Generated:' data/commands.toml) \
                || { echo "::error::data/commands.toml stale vs llms-full.txt — run 'make extract' and commit (see make validate)"; exit 1; }
            else
              echo "::warning::HEAD:data/commands.toml not found (shallow/history rewrite) — checking file exists and is non-empty"
              test -s data/commands.toml || { echo "::error::data/commands.toml empty"; exit 1; }
              # Also guard basic structure: must contain [[menus]]
              grep -q '^\[\[menus\]\]' data/commands.toml || { echo "::error::data/commands.toml missing [[menus]]"; exit 1; }
            fi
          else
            echo "::error::data/commands.toml not generated"
            exit 1
          fi
          echo "commands.toml OK (timestamps ignored)"
          # Restore file to avoid polluting cache/upload — we only cared about the diff.
          git checkout -- data/commands.toml 2>/dev/null || true

  # ── Grammar: mirrors `make generate-check && make test-grammar` ──
  grammar:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # grammars/rsc is an untracked working copy (nested gitlinks break the
      # zed-industries/extensions packaging), so clone it at the pinned rev.
      - name: Clone grammar at pinned rev
        run: |
          set -eu
          REV=$(awk '/^\[grammars\.rsc\]/{f=1;next} f&&/^rev/{gsub(/"/,"",$3);print $3;exit}' extension.toml)
          if [ -z "$REV" ]; then
            echo "::error::[grammars.rsc].rev missing in extension.toml"
            exit 1
          fi
          case "$REV" in *0000*)
            echo "::error::placeholder rev found ($REV) — run scripts/publish_grammar.py"; exit 1;;
          esac
          echo "$REV" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::REV must be 40-char hex ($REV)"; exit 1; }
          git clone --quiet https://github.com/balakar94/tree-sitter-rsc grammars/rsc
          if [ "$(git -C grammars/rsc rev-parse HEAD)" != "$REV" ]; then
            git -C grammars/rsc fetch --quiet --depth 1 origin "$REV"
            git -C grammars/rsc checkout --quiet --detach FETCH_HEAD
          fi
          echo "grammar pinned at $(git -C grammars/rsc rev-parse HEAD)"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grammars/rsc/package.json

      - name: Install tree-sitter-cli
        working-directory: grammars/rsc
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npx tree-sitter --version

      - name: Check parser is up-to-date (make generate-check)
        run: make generate-check

      - name: Run corpus tests (make test-grammar)
        run: make test-grammar

      - name: Verify grammar working copy matches pinned rev
        run: |
          set -eu
          # Parse [grammars.rsc] rev from extension.toml (TOML, not JSON).
          REV=$(awk '/^\[grammars\.rsc\]/{f=1;next} f&&/^rev/{gsub(/"/,"",$3);print $3;exit}' extension.toml)
          HEAD_SHA=$(git -C grammars/rsc rev-parse HEAD)
          echo "extension.toml rev=$REV"
          echo "working copy sha=$HEAD_SHA"
          if [ -z "$REV" ]; then
            echo "::error::[grammars.rsc].rev missing in extension.toml"
            exit 1
          fi
          if [ "$REV" != "$HEAD_SHA" ]; then
            echo "::error::[grammars.rsc].rev ($REV) != grammar checkout ($HEAD_SHA) — bump via 'python scripts/publish_grammar.py --push'"
            exit 1
          fi
          echo "rev OK"
