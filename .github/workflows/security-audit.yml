name: Supply Audit

# Weekly dependency CVE scans. Dependabot was intentionally removed
# (commit 6528c8e — manual dependency policy for a solo-maintained project);
# this workflow keeps an automated eye on advisories with no new infra.
# Policy (solo-maintainer noise control): the Python/npm job fails on
# HIGH/CRITICAL only; LOW/MODERATE findings are log-visible and non-failing.
# The Rust job keeps its existing fail-on-any-advisory behavior (RustSec
# entries against the locked Cargo.lock are already curated to actionable).
# No Dependabot config by policy — do not re-add it here.
# Runs Mondays and on demand; failure means a gated advisory matches.
#
# Scheduling caveat: GitHub disables scheduled workflows after 60 days without
# repository activity — if this job has not run for a while, use
# workflow_dispatch (or push any commit) to re-arm the cron.
#
# Failure routing: the notify job opens/comments the `supply-audit` issue on
# failure and closes it on the next green run, so a red scheduled run is not
# silent.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: RustSec • audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          # Pinned so a future CLI change cannot silently break this job;
          # bump deliberately when upgrading.
          tool: cargo-audit@0.22.2

      - name: Run cargo-audit
        run: |
          cargo audit --version
          cargo audit --file Cargo.lock

  py-npm-audit:
    name: Python/npm • audit (HIGH/CRITICAL only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: grammars/rsc/package.json

      - name: Python audit (pip-audit, HIGH/CRITICAL only)
        run: |
          set -eu
          python -m pip install --upgrade pip
          # Exact pins: requirements-ci.txt includes requirements-dev.txt plus
          # pip-audit. requests+paramiko mirror `make install-tools`: the
          # network-facing deploy/live-check surface is what we audit.
          pip install -r requirements-ci.txt
          python -m pip freeze | grep -Ei "pip-audit|requests|paramiko|^pytest==" || true
          # pip-audit has no native severity gate, so capture JSON and fail
          # only on HIGH/CRITICAL markers; LOW/MODERATE stay log-visible.
          # The exit code is decided by the gate below, not by pip-audit.
          set +e
          pip-audit --desc --format=json --output pip-audit.json
          AUDIT_RC=$?
          set -e
          echo "pip-audit exit=$AUDIT_RC"
          cat pip-audit.json || true
          # pip-audit exits 0 (clean) or 1 (vulns found); anything else is a tool failure.
          if [ "$AUDIT_RC" -ne 0 ] && [ "$AUDIT_RC" -ne 1 ]; then echo "::error::pip-audit tool failure (exit=$AUDIT_RC)"; exit 1; fi
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          report = Path("pip-audit.json")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
          except Exception as e:
              print(f"::error::cannot parse pip-audit.json: {e}")
              sys.exit(1)

          # pip-audit JSON is a list of deps; tolerate a {"dependencies": [...]} shape.
          deps = data.get("dependencies", data) if isinstance(data, dict) else data
          if not isinstance(deps, list):
              print(f"::error::unexpected pip-audit.json shape: {type(deps).__name__}")
              sys.exit(1)

          high_re = re.compile(r"\b(high|critical)\b", re.IGNORECASE)
          high = []
          other = []
          for dep in deps:
              if not isinstance(dep, dict):
                  continue
              name = dep.get("name", "?")
              ver = dep.get("version", "?")
              for vuln in dep.get("vulns", []) or []:
                  vid = vuln.get("id", "?") if isinstance(vuln, dict) else "?"
                  blob = json.dumps(vuln, sort_keys=True)
                  entry = f"{name}=={ver} {vid}"
                  (high if high_re.search(blob) else other).append(entry)

          for entry in high:
              print(f"::error::pip-audit HIGH/CRITICAL: {entry}")
          for entry in other:
              print(f"::warning::pip-audit below threshold (log only): {entry}")
          print(f"pip-audit HIGH/CRITICAL={len(high)} below-threshold={len(other)}")
          sys.exit(1 if high else 0)
          PY

      - name: npm audit (grammars/rsc, HIGH/CRITICAL only)
        working-directory: grammars/rsc
        run: |
          set -eu
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          # No --omit=dev: tree-sitter-cli lives in devDependencies, so omitting
          # dev would audit nothing. --audit-level=high implements the
          # HIGH/CRITICAL-only policy (LOW/MODERATE stay log-visible).
          npm audit --audit-level=high

  # ── Failure routing: open/comment a labeled issue, close it on recovery ──
  # Mirrors the docs-drift watchdog pattern so a red scheduled run is visible
  # without relying on GitHub's default notification settings.
  notify:
    name: Audit failure routing
    needs: [cargo-audit, py-npm-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Failure — open or update the supply-audit issue
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh label create supply-audit --color B60205 \
            --description "Supply audit failed (RustSec / pip-audit / npm audit)" >/dev/null 2>&1 || true
          number=$(gh issue list --state open --label supply-audit \
            --json number,title \
            --jq '.[] | select(.title | startswith("Supply audit failing")) | .number' \
            | head -n1)
          {
            echo "Failed at (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Results: cargo-audit=${{ needs.cargo-audit.result }} py-npm-audit=${{ needs.py-npm-audit.result }}"
            echo ""
            echo "Fix the gated advisory (any RustSec advisory; HIGH/CRITICAL for pip/npm),"
            echo "then re-run the workflow — this issue closes automatically once both jobs pass."
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$number" ]; then
            echo "Open issue #$number found — appending this run's report."
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            echo "No open issue — creating one."
            gh issue create --title "Supply audit failing" --label supply-audit --body-file "$RUNNER_TEMP/body.md"
          fi
          echo "::warning::Supply audit failed — issue updated"

      - name: Recovery — close the supply-audit issue if open
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          number=$(gh issue list --state open --label supply-audit \
            --json number,title \
            --jq '.[] | select(.title | startswith("Supply audit failing")) | .number' \
            | head -n1)
          if [ -z "$number" ]; then
            echo "No open supply-audit issue — nothing to close."
            exit 0
          fi
          echo "Closing #$number (both audit jobs passed)."
          gh issue comment "$number" --body "Recovered: both audit jobs passed on $(date -u '+%Y-%m-%dT%H:%M:%SZ')."
          gh issue close "$number" --reason completed
