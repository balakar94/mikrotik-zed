name: Security audit

# Weekly Rust dependency CVE scan. Dependabot was intentionally removed
# (commit 6528c8e — manual dependency policy for a solo-maintained project);
# this workflow keeps an automated eye on the RustSec Advisory Database only.
# Runs Mondays and on demand; failure means Cargo.lock matches a known advisory.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: |
          cargo-audit --version
          cargo-audit --file Cargo.lock
