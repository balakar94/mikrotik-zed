version: 2
updates:
  # GitHub Actions — keeps actions/checkout, setup-python, setup-node, rust-cache, etc. pinned.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions"]

  # Cargo — Rust dependencies (root + lsp workspace). Respects Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]

  # npm — tree-sitter grammar (grammars/rsc/package.json)
  - package-ecosystem: "npm"
    directory: "/grammars/rsc"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "grammar"]
