[package]
name = "rsc-ls"
version = "0.5.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "MikroTik RouterOS Script language server — LSP binary"
homepage = "https://github.com/balakar94/mikrotik-zed"
repository = "https://github.com/balakar94/mikrotik-zed"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8" # pinned intentionally: 0.8 is stable on MSRV 1.90; 0.9 offers no needed features — avoid churn
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
