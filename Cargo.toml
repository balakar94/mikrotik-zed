[package]
name = "mikrotik-zed"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Zed extension for MikroTik RouterOS Script — bootstraps the rsc-ls language server"
homepage = "https://github.com/balakar94/mikrotik-zed"
repository = "https://github.com/balakar94/mikrotik-zed"
keywords = ["mikrotik", "routeros", "zed", "editor"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"

[dev-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["lsp"]
exclude = ["grammars/rsc"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
